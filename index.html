<style>
/* VOICE: calm, clinical, encouraging — a consult room
   IDEA: clinic clipboard — patient tag, conversation, record sheet
   COLOUR and TYPE: deep clinic teal, white sheets, coral only for turns running out and safety; IBM Plex Sans Thai */
:root{color-scheme:light dark;--bg:light-dark(#e9efee,#0c1718);--sheet:light-dark(#fff,#132324);--ink:light-dark(#10201f,#e4eeed);--mute:light-dark(#566866,#9db1af);--line:light-dark(#d3dddb,#26393a);--teal:light-dark(#0b5c61,#5fc4c6);--tealbg:light-dark(#0b5c61,#0f3d40);--soft:light-dark(#dcebea,#173436);--coral:light-dark(#c9431a,#ff8a5c);--ok:light-dark(#1d7a4a,#6fd39b);--mark:light-dark(#ffe3a3,#5a4510)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,3.6vw,36px)}h2{font-size:22px}h3{font-size:18px}
a{color:var(--teal)}
button,select,input,textarea{font:inherit;font-size:16px;color:inherit}
button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);cursor:pointer}
button.pri{background:var(--teal);color:light-dark(#fff,#062021);border-color:transparent;font-weight:600}
button.warn{border-color:var(--coral);color:var(--coral)}
button.ghost{background:none;border-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 12px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--teal);vertical-align:middle}
textarea{min-height:76px;resize:vertical}
textarea.code{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:420px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
label{font-weight:600;font-size:15px;display:block;margin:14px 0 6px}
label.check{font-weight:500;display:flex;gap:8px;align-items:center}
.hint{color:var(--mute);font-size:14px;font-weight:400}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
header.top{background:var(--tealbg);color:#fff;padding:16px max(4vw,14px)}
header.top>.row{max-width:1240px;margin:0 auto}
header.top a{color:#fff;text-decoration:none}
header.top .brand{font-weight:700;font-size:20px}
header.top button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
header.top .ai-pill{font-size:13px;opacity:.85}
main{max-width:1240px;margin:0 auto;padding:20px max(4vw,14px) 60px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.4vw,26px)}
.sheet+.sheet,section+section{margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--teal);font-weight:600}
.tag.warn{background:none;border:1px solid var(--coral);color:var(--coral)}
.tag.ok{color:var(--ok)}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px;height:100%;border-radius:14px}
.card:hover{border-color:var(--teal)}
.quote{font-size:15px;color:var(--mute);border-left:3px solid var(--teal);padding-left:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button[aria-selected=true]{background:var(--teal);color:light-dark(#fff,#062021);border-color:transparent;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mute)}
.drop.over{border-color:var(--teal);background:var(--soft)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.preview{max-height:340px;overflow:auto;white-space:pre-wrap;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:14px;color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
/* consult */
.consult{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.chat{height:min(60vh,620px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 4px 12px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;white-space:pre-wrap}
.msg.o{background:var(--soft);border-bottom-left-radius:4px}
.msg.s{align-self:flex-end;background:var(--teal);color:light-dark(#fff,#062021);border-bottom-right-radius:4px}
.msg .who{display:block;font-size:13px;font-weight:600;opacity:.75}
.msg.sys{align-self:center;background:none;color:var(--mute);font-size:14px;text-align:center}
.compose{display:flex;gap:10px;margin-top:10px}.compose textarea{min-height:52px}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.meter{display:grid;gap:3px;margin:10px 0}
.meter i{height:16px;border-radius:3px;background:var(--line)}
.meter i.u{background:var(--teal)}.meter i.l{background:var(--coral)}
.big{font-size:44px;font-weight:700;line-height:1}
.brief{border-left:4px solid var(--coral);padding:8px 12px;background:var(--soft);border-radius:8px;margin-bottom:10px;font-size:15px}
.lab{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.lab input[type=text]{grid-column:2;font-size:15px;padding:8px 10px}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bar{grid-column:1/-1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--teal)}
.cap{border:2px solid var(--coral);border-radius:12px;padding:12px 16px}
.cap strong{color:var(--coral)}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring{width:132px;height:132px}
.wait{display:flex;gap:10px;align-items:center;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--teal);animation:p 1s infinite alternate;flex:none}
@keyframes p{to{opacity:.2}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,20,20,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal-box{background:var(--sheet);border-radius:16px;padding:22px;width:min(640px,100%);max-height:92vh;overflow:auto}
.seg{display:grid;gap:6px;margin-top:12px}
.seg label{font-weight:500;display:flex;gap:8px;align-items:center;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.status{min-height:24px;font-size:14px;color:var(--teal);margin:10px 0 0}
ul,ol{padding-left:22px;margin:6px 0}
[hidden]{display:none!important}
@media(max-width:780px){.consult,.two{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}.chat{height:52vh}.verdict{grid-template-columns:minmax(0,1fr)}.msg{max-width:92%}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;font-weight:600;color:var(--mute)}.stack td:empty{display:none}}
/* ---- v3 shell ---- */
header.top nav{display:flex;gap:4px;flex-wrap:wrap}
header.top nav a{padding:8px 12px;border-radius:8px;opacity:.85}
header.top nav a[aria-current=page]{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
.ai-pill.warn{color:#ffd2c2;opacity:1}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--tealbg);color:#fff;border-radius:20px;padding:clamp(22px,4vw,44px)}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.1}
.hero p{opacity:.9;font-size:17px;max-width:56ch}
.hero .setup{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.1);padding:12px 14px;border-radius:12px}
.hero .setup .pri{background:#fff;color:#0b5c61}
.hero-art{width:100%;max-height:240px}
.hero-art .bub-o{fill:rgba(255,255,255,.92)}.hero-art .bub-s{fill:#5fc4c6}
.hero-art .ln{fill:#0b5c61;opacity:.35}.hero-art .ln2{fill:#063a3d;opacity:.45}
.hero-art .meter rect{fill:rgba(255,255,255,.25)}.hero-art .meter .u{fill:#fff}.hero-art .meter .l{fill:#ff8a5c}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;margin-top:16px}
.role{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.role:hover{border-color:var(--teal)}
.role h2{color:var(--teal)}.role .go{margin-top:auto;font-weight:600;color:var(--teal)}
.levels{display:grid;gap:8px}.lv{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
/* drop zones */
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.drop.drop-xl{padding:40px 20px;border-width:3px;background:var(--soft)}
.drop svg{color:var(--teal)}
.drop b{color:var(--ink);font-size:17px}
/* settings panel */
.modal-box.wide{width:min(860px,100%)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px;margin-top:8px}
.pcard{display:flex;gap:10px;align-items:flex-start;margin:0;padding:12px;border:1px solid var(--line);border-radius:12px;font-weight:400;cursor:pointer}
.pcard.on{border:2px solid var(--teal);background:var(--soft)}
.pcard input{margin-top:3px}
.guide{margin-top:14px;border-left:4px solid var(--teal);background:var(--soft);border-radius:10px;padding:12px 14px}
.guide ol{margin:8px 0}
.btnlink{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;background:var(--teal);color:light-dark(#fff,#062021);text-decoration:none;font-weight:600}
.chip{min-height:36px;padding:0 12px;border-radius:99px;font-size:14px}
input[readonly]{background:var(--soft);color:var(--mute)}
/* studio */
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 20px;margin-top:10px}
.tips h3{font-size:16px;color:var(--teal)}
.tips ul{font-size:15px}
.fileblock{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.redactor{margin:10px 0}
.redactor canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;cursor:crosshair;touch-action:none;display:block}
/* board */
.board .me{background:var(--soft)}
.rank{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:700;background:var(--line)}
.rank.r1{background:#e8b923;color:#3a2a00}.rank.r2{background:#c9d1d6;color:#222}.rank.r3{background:#d39058;color:#2a1400}
.score-n{font-size:20px}
.brow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px;margin-top:8px}
.bitem{display:flex;gap:10px;align-items:center;font-size:14px}
.bitem.locked{opacity:.55}
svg.badge text{fill:#fff}
svg.badge .bg{fill:var(--bc)}svg.badge .rim{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.2}
svg.badge.off .bg{fill:var(--line)}svg.badge.off text{fill:var(--mute)}
svg.badge.spec{--bc:light-dark(#0b5c61,#2f8f93)}svg.badge.skill{--bc:light-dark(#2d5fa8,#4a7fd0)}svg.badge.safe{--bc:light-dark(#c9431a,#d9653a)}
svg.badge.persona{--bc:light-dark(#7a4d9c,#9a6fbe)}svg.badge.path{--bc:light-dark(#a17a00,#b8901a)}
.toast{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--sheet);border:2px solid var(--teal);border-radius:14px;padding:12px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);max-width:min(420px,calc(100vw - 32px));transition:opacity .6s,transform .6s}
.toast.out{opacity:0;transform:translateY(10px)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:780px){.hero{grid-template-columns:minmax(0,1fr)}.hero-art{max-height:160px}header.top nav{order:3;width:100%}}

</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
