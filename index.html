<script type="application/json" id="vil-data">{"cases": [{"file": "01-dog-parvovirus.md", "md": "---\nid: 01-dog-parvovirus\ntitle: \"Parvovirus\"\nspecies: dog\nsystem: \"GI, ติดเชื้อ\"\nlevel: Beginner\nquota: 10\nurgency: high\npersona: \"Low literacy\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"ลัคกี้\\\" สุนัขพันธุ์ผสม เพศผู้ ไม่ทำหมัน อายุ 3 เดือน 3.2 kg\"\nopening: \"หมอคะ น้องหมาเด็กซึมมากเลย วันนี้อ้วกไป 4-5 รอบแล้ว ไม่ยอมกินข้าวเลยค่ะ\"\n---\n\n# เคส 1 — ลูกสุนัขซึม อ้วก ไม่กินข้าว (Parvovirus)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"ลัคกี้\" สุนัขพันธุ์ผสม เพศผู้ ไม่ทำหมัน อายุ 3 เดือน 3.2 kg |\n| เจ้าของ | คุณนุ่น อายุ 26 เลี้ยงสุนัขครั้งแรก อยู่คอนโด บุคลิกเริ่มต้น Low literacy ผสมความกังวลและความรู้สึกผิด |\n| ประโยคเปิด | \"หมอคะ น้องหมาเด็กซึมมากเลย วันนี้อ้วกไป 4-5 รอบแล้ว ไม่ยอมกินข้าวเลยค่ะ\" |\n| พูดเองโดยไม่ต้องถาม (V) | ซึม อ้วก 4–5 รอบ ไม่กินข้าว เท่านั้น |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| เริ่มป่วย / ไทม์ไลน์ | T | \"เมื่อวานเย็นยังวิ่งเล่นอยู่เลยค่ะ ตกดึกเริ่มนอนเฉยๆ เช้านี้เริ่มอ้วก\" |\n| ลักษณะอาเจียน | T | \"เป็นน้ำเหลืองๆ มีฟอง ไม่มีเม็ดอาหารแล้วค่ะ\" |\n| อุจจาระ | T | \"เมื่อคืนเริ่มเหลวเป็นน้ำ สีแดงๆ คล้ำๆ กลิ่นคาวมากเลยค่ะ\" |\n| ถามต่อว่าเป็นเลือดหรือไม่ | S | \"เหมือนน้ำล้างเนื้อค่ะ แดงๆ เหลวๆ ไม่มีเป็นก้อนเลย\" |\n| กินอาหาร / ดื่มน้ำ | T | \"ไม่กินเลยตั้งแต่เช้า น้ำเอาปากไปจ่อก็เลียนิดเดียว แล้วอ้วกตามค่ะ\" |\n| วัคซีน | T | \"คนขายบอกว่าฉีดแล้วค่ะ แต่ไม่ได้ให้สมุดมา\" |\n| วัคซีนกี่เข็ม วันที่ ยี่ห้อ | S | \"ไม่ทราบค่ะ ไม่มีหลักฐานเลย\" |\n| ที่มาของสุนัข | T | \"ซื้อจากตลาดจตุจักรเมื่อ 5 วันก่อนค่ะ\" |\n| สัตว์ตัวอื่นที่ร้าน | S | \"ในกรงมีลูกหมาหลายตัว เห็นตัวหนึ่งนอนซึมๆ คนขายบอกแค่ง่วงค่ะ\" |\n| สัตว์อื่นในบ้าน / พาไปที่ไหน | S | \"ไม่มีตัวอื่นค่ะ อยู่คอนโด แต่พาลงไปสนามหญ้าข้างล่าง 2 วันก่อน\" |\n| ถ่ายพยาธิ | T | \"ไม่เคยค่ะ ไม่รู้ว่าต้องถ่าย\" |\n| อาหาร | T | \"อาหารเม็ดลูกหมาถุงเล็กที่ร้านให้มา ไม่ได้เปลี่ยน ไม่ให้ขนมคน\" |\n| สิ่งแปลกปลอม / สารพิษ | S | \"ไม่เห็นกินอะไรเลยค่ะ ของเล่นยังอยู่ครบ\" |\n| ไอ น้ำมูก ชัก | S | \"ไม่มีค่ะ\" |\n| ปัสสาวะ | T | \"ไม่ค่อยเห็นฉี่เลยค่ะ ไม่แน่ใจ\" |\n| ยา / โรคประจำตัว | T | \"ไม่มีค่ะ\" |\n\nสถานะ Guarded: ถ้าถูกตำหนิเรื่องซื้อจากตลาด เจ้าของจะไม่เล่าเรื่องตัวอื่นในกรงที่ซึมเอง ต้องถามซ้ำแบบไม่ตัดสิน\n\n## C. ตรวจร่างกายเบื้องต้น\nT 40.0 °C · HR 160 · RR 40 · เยื่อเมือกชมพูซีด ปากแห้งเหนียว · CRT 2.5 วินาที · ขาดน้ำประมาณ 7–8% · เจ็บท้องเล็กน้อยเมื่อคลำ · อุจจาระบนปรอทเป็นน้ำสีแดงคล้ำ กลิ่นคาว\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| Fecal CPV antigen test | Positive | — |\n| CBC: WBC | 1.6 ×10³/µL | 6–17 (leukopenia, neutropenia) |\n| CBC: Hct | 44% | 37–55 (เลือดข้นจากขาดน้ำ) |\n| Blood glucose | 58 mg/dL | 70–120 (ต่ำ) |\n| Fecal flotation | ไม่พบไข่พยาธิ | — |\n| X-ray ช่องท้อง | ลำไส้เล็กขยายเป็นของเหลวและแก๊สทั่วไป ไม่เห็นวัตถุอุดตัน ไม่มี obstructive pattern | ช่วยตัด foreign body ออก |\n\n## E. เฉลยลับ\n- โรค: Canine parvoviral enteritis\n- Differential: parasitic enteritis, foreign body / intussusception, distemper หรือไวรัสลำไส้อื่น, bacterial enteritis / dietary indiscretion\n- ตัวลวง: \"ฉีดวัคซีนแล้ว\" ที่ไม่มีหลักฐาน และอุจจาระ \"สีแดงคล้ำ\" ที่ต้องถามต่อเพื่อแยกเลือดสดกับเลือดเก่า\n\n## F. เกณฑ์การถาม\n- Must-ask: เริ่มป่วยเมื่อไร · ลักษณะอาเจียน · ลักษณะอุจจาระ (สี เลือด กลิ่น) · กินและดื่มน้ำ · วัคซีน (กี่เข็ม วันที่ มีหลักฐานหรือไม่) · ที่มาและสัตว์ตัวอื่นที่ป่วย · ถ่ายพยาธิ · สิ่งแปลกปลอม\n- High-value: อาหารและการเปลี่ยนอาหาร · สถานที่ที่พาไป · ไอ น้ำมูก ชัก · ปัสสาวะ\n- Critical miss: ไม่ถามวัคซีน หรือไม่ถามลักษณะอุจจาระ\n- Safety: ต้องตระหนักเรื่องขาดน้ำและน้ำตาลต่ำในลูกสุนัข และต้องแยกสัตว์ป่วยทันทีโดยไม่รอผล ห้ามแนะนำให้เจ้าของให้ยาหรือสารใดเองที่บ้าน\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"ซึม\" | Lethargy |\n| \"อ้วก 4–5 รอบ น้ำเหลืองๆ มีฟอง\" | Acute vomiting 4–5 episodes in \\~1 day, bile-tinged foamy |\n| \"เหลวเป็นน้ำ แดงๆ เหมือนน้ำล้างเนื้อ กลิ่นคาว\" | Acute hemorrhagic diarrhea (watery, red, malodorous) |\n| \"คนขายว่าฉีดแล้ว แต่ไม่มีสมุด\" | Vaccination status unverified → ถือเป็น unvaccinated จนกว่าจะมีหลักฐาน |\n| \"ซื้อจากตลาด ตัวอื่นในกรงซึม\" | Source: pet market, possible exposure to sick in-contact puppies |\n\n## H. Key take-away และคำถามชวนคิด\n1. คำตอบที่ไม่มีหลักฐานไม่ใช่ข้อเท็จจริง: \"ฉีดแล้ว\" ต้องตามด้วย กี่เข็ม วันไหน ยี่ห้ออะไร มีสมุดไหม\n2. ใช้ Funnel จากเปิดไปเจาะจง: \"ช่วยเล่าเรื่องอุจจาระให้ฟังหน่อยค่ะ\" ก่อน แล้วตามด้วย \"สีอะไร กลิ่นเป็นอย่างไร\" ดีกว่าคำถามชี้นำ \"ถ่ายเป็นเลือดใช่ไหม\"\n3. ภูเขาน้ำแข็ง: ใต้คำว่า \"ซื้อมาจากตลาด\" มักเป็นความรู้สึกผิด จึงควรเข้าใจก่อนตัดสิน ไม่ตำหนิแหล่งที่มา\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- เจ้าของบอกว่าฉีดวัคซีนแล้ว คุณเชื่อทันทีหรือไม่ และถามอะไรต่อ\n- ประโยคไหนของคุณที่ทำให้เจ้าของรู้สึกว่าถูกรับฟัง และประโยคไหนที่อาจรู้สึกว่าถูกตัดสิน\n- ถ้าถามได้อีกข้อเดียว คุณจะถามอะไรเพื่อแยก parvovirus ออกจากสิ่งแปลกปลอม\n"}, {"file": "02-dog-gi-foreign-body.md", "md": "---\nid: 02-dog-gi-foreign-body\ntitle: \"GI foreign body\"\nspecies: dog\nsystem: \"GI\"\nlevel: Beginner\nquota: 10\nurgency: high\npersona: \"Cooperative\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"มิโล\\\" ลาบราดอร์ รีทรีฟเวอร์ เพศผู้ ทำหมันแล้ว 2 ปี 28 kg เลี้ยงในบ้านและสวน\"\nopening: \"หมอครับ น้องอ้วกตั้งแต่เมื่อคืน วันนี้กินอะไรก็อ้วก แม้แต่น้ำ ดูไม่ร่าเริงเลยครับ\"\n---\n\n# เคส 2 — สุนัขอ้วกซ้ำ กินอะไรก็อ้วก (GI foreign body)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"มิโล\" ลาบราดอร์ รีทรีฟเวอร์ เพศผู้ ทำหมันแล้ว 2 ปี 28 kg เลี้ยงในบ้านและสวน |\n| เจ้าของ | คุณต้น อายุ 35 บุคลิกเริ่มต้น Cooperative ตอบดี แต่ไม่เชื่อมโยงของที่หายกับอาการ |\n| ประโยคเปิด | \"หมอครับ น้องอ้วกตั้งแต่เมื่อคืน วันนี้กินอะไรก็อ้วก แม้แต่น้ำ ดูไม่ร่าเริงเลยครับ\" |\n| พูดเองโดยไม่ต้องถาม (V) | อ้วกตั้งแต่เมื่อคืน กินอะไรก็อ้วก ซึม |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| เริ่มอ้วก / จำนวนครั้ง | T | \"เริ่มประมาณ 14 ชั่วโมงก่อน ดึกๆ เมื่อคืนครับ อ้วก 4 รอบ\" |\n| ลักษณะอาเจียน | T | \"แรกๆ เป็นอาหาร หลังๆ เป็นน้ำกับฟองขาวๆ\" |\n| กินอาหาร / ดื่มน้ำ | T | \"ไม่กินข้าวเช้า ให้น้ำแล้วอ้วกตามภายในไม่กี่นาที\" |\n| อุจจาระ | T | \"ถ่ายครั้งสุดท้ายเมื่อวานเช้า ปกติแต่น้อยกว่าทุกวัน วันนี้ยังไม่ถ่าย\" |\n| ผายลม | U | \"ไม่ทราบครับ ไม่ได้สังเกต\" |\n| ท่าทาง / ปวดท้อง | T | \"มีท่าก้นโด่ง ตัวยืดไปข้างหน้า 2–3 ครั้ง ไม่ให้จับท้อง\" |\n| กินสิ่งแปลกปลอม / ของหาย | S | \"ไม่เห็นว่ากินอะไร... อ๋อ ของเล่นยางรูปหมีชิ้นเล็กหายไปสองวันแล้ว นึกว่าเก็บไว้ที่ไหนสักแห่ง\" |\n| นิสัยกัดของเล่น | S | \"ชอบกัดครับ ชิ้นเก่าๆ เคยกัดขาดหลายชิ้น\" |\n| สารพิษ / อาหารใหม่ | S | \"ไม่มีครับ ในสวนไม่ได้ใช้ยาฆ่าแมลง ไม่ได้เปลี่ยนอาหาร\" |\n| ยา | T | \"ไม่มีครับ\" |\n| อาหาร | T | \"เม็ดเกรดทั่วไป ยี่ห้อเดิมตลอด\" |\n| วัคซีน / ถ่ายพยาธิ | T | \"ครบตามนัด ถ่ายพยาธิเมื่อ 3 เดือนก่อน\" |\n| ประวัติเดิม | T | \"เคยอ้วกตอนกินหญ้า 1–2 ครั้ง นอกนั้นแข็งแรง ไม่เคยผ่าตัด\" |\n| อ้วกเป็นเลือด / ดำ | S | \"ไม่มีครับ\" |\n| พฤติกรรม | T | \"เงียบ นอนซม ไม่เล่นตั้งแต่เช้า\" |\n\nสถานะ Guarded: ถ้าถูกตำหนิเรื่องปล่อยให้กัดของเล่น เจ้าของจะตอบเรื่องของเล่นสั้นลงและไม่เสนอข้อมูลเอง\n\n## C. ตรวจร่างกายเบื้องต้น\nT 39.2 °C · HR 130 · RR 36 · เยื่อเมือกชมพู แห้งเหนียว · CRT 2 วินาที · ขาดน้ำประมาณ 7% · เจ็บเมื่อกดท้องส่วนหน้า-กลาง คลำได้ลำไส้ขยายเป็นลูกๆ ไม่พบก้อนชัดเจน\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| CBC: WBC | 17.8 ×10³/µL | 6–17 (neutrophilia แบบเครียด) |\n| CBC: Hct | 52% | 37–55 (เลือดข้นจากขาดน้ำ) |\n| Chem: K | 3.3 mmol/L | 3.5–5.8 (ต่ำ) |\n| Chem: Cl | 100 mmol/L | 106–118 (ต่ำ) |\n| BUN | 28 mg/dL | 7–27 (สูงเล็กน้อย) |\n| cPL test | ปกติ | ช่วยลดความเป็นไปได้ของ pancreatitis |\n| X-ray ช่องท้อง | ลำไส้เล็กส่วนต้น-กลางขยายเป็นลูกๆ มีแก๊สและของเหลว (obstructive pattern) ไม่เห็นวัตถุทึบรังสีชัดเจน | ของเล่นยางอาจไม่ทึบรังสี การไม่เห็นวัตถุไม่ตัดโรคออก |\n| Ultrasound | พบวัตถุสะท้อนเสียงพร้อม acoustic shadow ในลำไส้เล็กส่วนต้น ลำไส้ก่อนหน้าขยาย ไม่พบ intussusception | — |\n\n## E. เฉลยลับ\n- โรค: GI foreign body ทำให้เกิด mechanical obstruction ของลำไส้เล็ก\n- Differential: acute gastroenteritis, pancreatitis, toxin ingestion, intussusception\n- ตัวลวง: ไม่มีไข้สูงและอ้วกหลังกินน้ำ ชวนให้คิดว่าเป็น gastroenteritis ทั่วไป และเจ้าของไม่เอ่ยเรื่องของเล่นหายเอง\n\n## F. เกณฑ์การถาม\n- Must-ask: เริ่มอ้วกเมื่อไร · ลักษณะและจำนวนครั้ง · กินอาหารและน้ำได้ไหม อ้วกหลังกินน้ำไหม · มีโอกาสกินสิ่งแปลกปลอมไหม · อุจจาระครั้งสุดท้ายและผายลม · ปวดท้อง ซึมลงไหม\n- High-value: การเปลี่ยนอาหาร · การสัมผัสสารพิษ · ยาที่ได้รับ · ประวัติอาการเดิม\n- Critical miss: ไม่ถามเรื่องสิ่งแปลกปลอมหรือของที่หายไป ทั้งที่อาเจียนเฉียบพลัน\n- Safety: ต้องระบุว่าอ้วกซ้ำร่วมกับสงสัยกินสิ่งแปลกปลอมอาจเป็นภาวะฉุกเฉิน และห้ามแนะนำให้ทำให้อ้วกหรือให้ยาเองที่บ้าน\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"กินอะไรก็อ้วก แม้แต่น้ำ\" | Persistent vomiting, intolerance of food and water |\n| \"ก้นโด่ง ตัวยืด ไม่ให้จับท้อง\" | Abdominal discomfort (prayer posture), possible cranial abdominal pain |\n| \"ของเล่นยางหายไปสองวัน\" | Possible unwitnessed foreign body ingestion (rubber toy) |\n| \"ถ่ายเมื่อวานน้อยกว่าปกติ ยังไม่ผายลม\" | Reduced fecal output, last defecation \\~24 h ago, flatus unknown |\n| \"ซึม ไม่เล่น\" | Lethargy |\n\n## H. Key take-away และคำถามชวนคิด\n1. เจ้าของไม่ได้ปิดบัง แค่ไม่รู้ว่าสิ่งนั้นสำคัญ หมอต้องเป็นฝ่ายเชื่อมจุด ด้วยการถามเรื่องของที่หาย ขาด หรือผิดสังเกต แม้ไม่มีใครเห็นสุนัขกิน\n2. ถามเรื่องที่เปลี่ยนความเร่งด่วนก่อน เช่น อ้วกหลังกินน้ำไหม เพราะบอกระดับความรุนแรงได้เร็วกว่าถามทุกหมวดตามลำดับ\n3. ปิดด้วย teach-back: \"ช่วยเล่าให้ฟังหน่อยว่าระหว่างรอผลตรวจ เราตกลงว่าจะไม่ทำอะไรที่บ้าน\" เพื่อกันเจ้าของลงมือทำให้อ้วกเอง และใช้ Ask-Provide-Ask เมื่อพูดถึงโอกาสผ่าตัดและค่าใช้จ่าย\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- เจ้าของไม่ได้เห็นสุนัขกินอะไร คุณถามเรื่องของเล่นด้วยคำถามปลายเปิดหรือปลายปิด และได้ข้อมูลต่างกันอย่างไร\n- ถ้าเจ้าของถามว่า \"ให้กินนมแล้วให้อ้วกออกมาได้ไหม\" คุณจะตอบอย่างไรโดยไม่ทำให้เขารู้สึกถูกตำหนิ\n- จากประวัติอย่างเดียว อะไรทำให้คุณจัด foreign body สูงกว่า gastroenteritis\n"}, {"file": "03-cat-urethral-obstruction.md", "md": "---\nid: 03-cat-urethral-obstruction\ntitle: \"Feline urethral obstruction\"\nspecies: cat\nsystem: \"ทางเดินปัสสาวะ\"\nlevel: Beginner\nquota: 10\nurgency: critical\npersona: \"Anxious\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"โมโม่\\\" แมวพันธุ์ผสม เพศผู้ ทำหมันแล้ว 4 ปี 5.2 kg เลี้ยงในบ้านอย่างเดียว\"\nopening: \"หมอครับ น้องแมวเข้ากระบะทรายบ่อยมากเลย แต่นั่งเบ่งตั้งนานไม่มีฉี่ออกมา ร้องหง่าวๆ ตลอดเวลา\"\n---\n\n# เคส 3 — แมวเข้ากระบะบ่อย เบ่งแต่ไม่มีฉี่ (Feline urethral obstruction)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"โมโม่\" แมวพันธุ์ผสม เพศผู้ ทำหมันแล้ว 4 ปี 5.2 kg เลี้ยงในบ้านอย่างเดียว |\n| เจ้าของ | คุณเอ็ม อายุ 31 บุคลิกเริ่มต้น Anxious เชื่อว่าน้องท้องผูก พูดซ้ำว่า \"น้องจะเป็นอะไรไหมครับ\" |\n| ประโยคเปิด | \"หมอครับ น้องแมวเข้ากระบะทรายบ่อยมากเลย แต่นั่งเบ่งตั้งนานไม่มีฉี่ออกมา ร้องหง่าวๆ ตลอดเวลา\" |\n| พูดเองโดยไม่ต้องถาม (V) | เข้ากระบะบ่อย เบ่งนาน ไม่มีฉี่ ร้อง เท่านั้น |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| เริ่มผิดปกติ | T | \"ตั้งแต่เมื่อวานเช้าครับ ประมาณ 24 ชั่วโมงได้\" |\n| จำนวนครั้งที่เข้ากระบะ | T | \"บอกไม่ถูก น่าจะ 15 ครั้งขึ้นไป เข้าๆ ออกๆ\" |\n| ครั้งสุดท้ายที่ฉี่ปริมาณปกติ | S | \"เช้าวานก่อนเริ่มเป็นครับ ก้อนทรายก้อนใหญ่ปกติ หลังจากนั้นไม่เห็นก้อนใหญ่อีกเลย\" |\n| ตอนนี้มีฉี่ออกไหม / ปริมาณ | S | \"เมื่อวานบ่ายเห็นเป็นหยดเล็กๆ 2–3 ครั้ง ตั้งแต่เมื่อคืนไม่เห็นเลยครับ\" |\n| สี / เลือด | S | \"หยดที่เห็นสีชมพูๆ ครับ\" |\n| ท่าทางตอนเบ่ง | T | \"นั่งท่าฉี่ ตัวสั่น ร้องหง่าวๆ ตอนเบ่ง แล้วเลียตรงท่อฉี่บ่อยมาก\" |\n| อุจจาระ | T | \"เมื่อวานไม่ถ่าย เลยคิดว่าท้องผูก ปกติถ่ายวันละครั้ง ก้อนปกติ\" |\n| กินอาหาร | T | \"เมื่อวานเย็นไม่กิน เช้านี้ก็ไม่แตะ\" |\n| อ้วก | T | \"เช้านี้อ้วก 1 ครั้ง เป็นน้ำเหลืองๆ\" |\n| ซึม | T | \"ซ่อนใต้เตียง นอนนิ่งขึ้น\" |\n| ดื่มน้ำ | T | \"ปกติไม่ค่อยดื่ม 2 วันนี้ยิ่งน้อย\" |\n| ประวัติทางเดินปัสสาวะ | T | \"8 เดือนก่อนเคยฉี่เป็นเลือด 1 ครั้ง ไปคลินิก ได้ยากินกับเปลี่ยนอาหารสองสัปดาห์ แล้วไม่ได้ตามต่อ\" |\n| อาหาร | T | \"เม็ดเกรดตลาดอย่างเดียว ไม่เคยให้อาหารเปียก\" |\n| สิ่งแวดล้อม / ความเครียด | S | \"ย้ายห้องใหม่เมื่อ 2 สัปดาห์ก่อน มีกระบะทราย 1 กระบะ\" |\n| ยา / โรคประจำตัว | T | \"ไม่มีครับ\" |\n| เพศ / ทำหมัน | T | \"ตัวผู้ ทำหมันตั้งแต่ 8 เดือน\" |\n\nสถานะ Guarded: ถ้านักศึกษาตำหนิที่รอมา 24 ชั่วโมง เจ้าของจะตอบสั้นลงและไม่เล่าเรื่องฉี่เป็นเลือดเมื่อ 8 เดือนก่อน\n\n## C. ตรวจร่างกายเบื้องต้น\nT 37.1 °C · HR 100 · RR 32 · ซึม อ่อนแรง · เยื่อเมือกชมพูซีด CRT 2.5 วินาที · กระเพาะปัสสาวะใหญ่ ตึง เจ็บ ขนาดประมาณส้ม · องคชาตบวมแดงคล้ำ · ขาดน้ำประมาณ 5%\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| BUN | 98 mg/dL | 14–36 |\n| Creatinine | 5.8 mg/dL | 0.8–2.4 (postrenal azotemia) |\n| Potassium | 7.2 mmol/L | 3.5–5.2 (hyperkalemia) |\n| Phosphorus | 9.5 mg/dL | 3.0–6.0 |\n| Venous pH / HCO3 | 7.18 / 12 | 7.25–7.40 / 18–24 (metabolic acidosis) |\n| PCV / TP | 45% / 8.0 g/dL | เลือดข้นจากขาดน้ำ |\n| ECG | HR 90, P wave แบน, T wave สูงแหลม | สอดคล้อง hyperkalemia |\n| X-ray | กระเพาะปัสสาวะขยายใหญ่ พบเงาทึบรังสีขนาดเล็กหลายก้อนที่คอกระเพาะปัสสาวะถึง urethra ส่วนต้น | — |\n| Ultrasound | กระเพาะปัสสาวะมี echogenic sediment และก้อน hyperechoic ที่คอกระเพาะ ไตมี pelvic dilation เล็กน้อย | — |\n\n## E. เฉลยลับ\n- โรค: Obstructive FLUTD คือ urethral obstruction จากนิ่วหรือ plug ร่วมกับ postrenal azotemia, hyperkalemia และ metabolic acidosis\n- Differential: feline idiopathic cystitis (ถ้าไม่อุดตัน), urolithiasis, UTI, constipation, urethral stricture\n- ตัวลวง: เจ้าของคิดว่าท้องผูก และการที่ \"มีหยดฉี่เมื่อวาน\" ทำให้ดูเหมือนยังไม่อุดตันสมบูรณ์ การที่เจ้าของไม่เห็นฉี่ไม่พอจะยืนยันการอุดตัน ต้องตรวจร่างกาย\n\n## F. เกณฑ์การถาม\n- Must-ask: ครั้งสุดท้ายที่เห็นฉี่ปริมาณปกติ · ตอนนี้มีฉี่ออกไหมและปริมาณ · เบ่ง ร้อง เลียหรือไม่ · มีเลือดปนไหม · อ้วก ซึม ไม่กิน · ประวัติทางเดินปัสสาวะ · เพศและทำหมัน\n- High-value: อาหารและน้ำ · กระบะทรายและความเครียด · ยาหรือการสวนปัสสาวะเดิม · อุจจาระ (เพื่อแยกจากท้องผูก)\n- Critical miss: ไม่ตรวจสอบปริมาณฉี่และเวลาที่ฉี่ปกติครั้งสุดท้าย\n- Safety: เป็นเคสฉุกเฉินวิกฤต ต้องบอกความเร่งด่วนและความจำเป็นต้องให้สัตวแพทย์ประเมินทันที ห้ามแนะนำให้บีบท้อง ให้ยาระบาย หรือให้ยาเอง\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"เข้ากระบะบ่อยมาก\" | Pollakiuria (frequent litter box attempts) |\n| \"นั่งเบ่งนานไม่มีฉี่\" | Stranguria with suspected oliguria / anuria (ต้องแยก \"ไม่เห็นฉี่\" กับ \"ไม่ได้ฉี่\") |\n| \"ร้องหง่าวๆ\" | Vocalization, signs of pain or distress |\n| \"เลียท่อฉี่บ่อย\" | Excessive genital grooming |\n| \"หยดสีชมพู\" | Gross hematuria, dysuria |\n| \"ท้องผูกมั้ง\" | Owner's impression เท่านั้น บันทึกข้อมูลจริงคือ no defecation × 1 day |\n\n## H. Key take-away และคำถามชวนคิด\n1. ป้ายที่เจ้าของให้ (\"ท้องผูก\") คือสมมติฐานของเขา ไม่ใช่ข้อมูล ให้ถามสิ่งที่เห็นจริง เช่น เห็นก้อนทรายไหม เห็นหยดอะไรออกมาไหม\n2. Triage-first: ในเคสฉุกเฉิน คำถามแรกๆ ควรเป็นคำถามที่เปลี่ยนความเร่งด่วน คือครั้งสุดท้ายที่ฉี่และตอนนี้ฉี่ออกไหม\n3. 3R: เจ้าของตื่นตระหนก ให้ Recognise ว่าเขากลัว Regulate ไม่ตื่นตามเขา แล้ว Respond ด้วยการสะท้อนความกังวลหนึ่งประโยค ต่อด้วยบอกชัดว่าต้องรีบ และไม่ตำหนิที่รอมา 24 ชั่วโมง\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- เจ้าของบอกว่า \"ไม่มีฉี่\" คุณถามอะไรต่อเพื่อแยกฉี่ไม่ออกจากฉี่บ่อยแต่ครั้งละน้อย\n- คุณแยก \"เบ่งฉี่\" กับ \"เบ่งอึ\" จากประวัติได้อย่างไร ใช้ 3 คำถามอะไร\n- ถ้าเจ้าของถามว่ารอดูอาการถึงพรุ่งนี้ได้ไหม คุณตอบด้วยคำพูดอย่างไรที่ชัดเจนแต่ไม่ขู่\n"}, {"file": "04-dog-pyometra.md", "md": "---\nid: 04-dog-pyometra\ntitle: \"Pyometra\"\nspecies: dog\nsystem: \"สืบพันธุ์\"\nlevel: Intermediate\nquota: 20\nurgency: high\npersona: \"Cooperative\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"เบลล่า\\\" ชิห์สุ เพศเมีย ไม่ทำหมัน 8 ปี 7.0 kg เลี้ยงในบ้าน\"\nopening: \"น้องซึมมา 3 วันแล้วค่ะ กินน้ำเยอะมาก ฉี่บ่อยด้วย กินข้าวก็น้อยลง\"\n---\n\n# เคส 4 — สุนัขแก่ซึม กินน้ำเยอะ ฉี่บ่อย (Pyometra)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"เบลล่า\" ชิห์สุ เพศเมีย ไม่ทำหมัน 8 ปี 7.0 kg เลี้ยงในบ้าน |\n| เจ้าของ | คุณแอน อายุ 52 บุคลิกเริ่มต้น Cooperative แต่รู้สึกผิดที่ตั้งใจทำหมันแล้วไม่ได้ทำ |\n| ประโยคเปิด | \"น้องซึมมา 3 วันแล้วค่ะ กินน้ำเยอะมาก ฉี่บ่อยด้วย กินข้าวก็น้อยลง\" |\n| พูดเองโดยไม่ต้องถาม (V) | ซึม 3 วัน กินน้ำเยอะ ฉี่บ่อย กินน้อยลง (ไม่เอ่ยเรื่องสิ่งคัดหลั่ง) |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| ซึม | T | \"นอนมากกว่าปกติ ไม่ค่อยวิ่งมารับตอนเรากลับบ้านค่ะ\" |\n| กินอาหาร | T | \"กินได้ประมาณครึ่งหนึ่งของปกติ เลือกกินค่ะ\" |\n| น้ำ | T | \"เติมชามน้ำวันละ 3 รอบ ปกติรอบเดียวค่ะ\" |\n| ปัสสาวะ | T | \"ฉี่บ่อยและครั้งละเยอะ ฉี่ในบ้าน 2 ครั้ง ทั้งที่ปกติไม่เคย สีเหลืองใส ไม่เห็นเลือดค่ะ\" |\n| อาเจียน | T | \"เมื่อวาน 1 ครั้ง เป็นน้ำเหลืองๆ ค่ะ\" |\n| ไข้ | S | \"จับตัวแล้วร้อนๆ ค่ะ ไม่ได้วัดปรอท\" |\n| สิ่งคัดหลั่งจากช่องคลอด | S | \"มีน้ำข้นๆ สีเหลืองครีมออกมานิดหน่อย กลิ่นเหม็น เห็นรอยที่ที่นอน เลียตรงนั้นบ่อยค่ะ เป็นมา 2–3 วัน\" |\n| ทำหมัน | T | \"ยังไม่ได้ทำค่ะ เคยตั้งใจแต่ไม่ได้ไป\" |\n| เป็นสัดครั้งล่าสุด | T | \"ประมาณ 7 สัปดาห์ก่อนค่ะ มีเลือดออกราว 10 วัน\" |\n| ผสมพันธุ์ / ตั้งท้อง | S | \"ไม่เคยให้ผสมและไม่เคยท้องค่ะ แต่ตอนเป็นสัดล่าสุดน้องหลุดไปหน้าบ้านครั้งหนึ่ง ไม่แน่ใจว่าโดนผสมหรือเปล่า\" |\n| ยาฮอร์โมน / ยาคุมสัด | S | \"เมื่อ 2 ปีก่อนฉีดยาคุมสัด 1–2 เข็มที่คลินิกค่ะ หลังจากนั้นไม่ได้ฉีดอีก\" |\n| ลักษณะท้อง | S | \"ท้องดูป่องกว่าเดิมนิดหน่อย จับแล้วน้องไม่ชอบค่ะ\" |\n| โรคประจำตัว / ยา | T | \"ไม่มีค่ะ ไม่ได้กินยาอะไร\" |\n| วัคซีน | T | \"ครบทุกปีค่ะ\" |\n| ผลเลือดเดิม | T | \"ไม่เคยตรวจเลือดค่ะ\" |\n\nสถานะ Guarded: ถ้านักศึกษาตัดสินเรื่องไม่ทำหมัน เจ้าของจะไม่เล่าเรื่องยาคุมสัดและการหลุดออกนอกบ้าน\n\n## C. ตรวจร่างกายเบื้องต้น\nT 39.8 °C · HR 140 · RR 36 · เยื่อเมือกชมพูซีด แห้ง · CRT 2.5 วินาที · ขาดน้ำประมาณ 7% · ท้องส่วนหลังตึงเล็กน้อย เจ็บเมื่อคลำ · มีสิ่งคัดหลั่งข้นสีเหลืองครีมกลิ่นเหม็นที่ช่องคลอด\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| CBC: WBC | 38.5 ×10³/µL | 6–17 (neutrophilia, left shift, toxic neutrophils) |\n| CBC: Hct | 33% | 37–55 (โลหิตจางเล็กน้อย non-regenerative) |\n| Globulin | 4.8 g/dL | 2.5–4.5 |\n| BUN / Creatinine | 36 / 1.5 mg/dL | 7–27 / 0.5–1.4 (prerenal และผลจาก endotoxin) |\n| ALP | 320 U/L | 20–150 |\n| Glucose | 105 mg/dL | ปกติ ช่วยลดโอกาส DM |\n| Urinalysis | USG 1.012 ไม่พบน้ำตาล | PU/PD จากการเสียความสามารถในการเข้มข้นปัสสาวะ |\n| Ultrasound | มดลูกขยายเป็นท่อ ผนังหนา มีของเหลวข้น echogenic ภายใน ไม่พบโครงกระดูกลูก | — |\n| X-ray | เงาท่อ soft tissue ในช่องท้องส่วนกลาง-ท้าย ไม่พบโครงกระดูกลูก | — |\n\n## E. เฉลยลับ\n- โรค: Pyometra (open cervix) ร่วมกับ systemic inflammatory response\n- Differential: pregnancy-related condition, vaginitis, metritis, UTI / pyelonephritis, primary PU/PD (DM, CKD, hyperadrenocorticism)\n- ตัวลวง: เปิดด้วย PU/PD ทำให้เสี่ยงวนไปทาง DM หรือไต สิ่งคัดหลั่งที่น้อยไม่ตัด pyometra ออก (closed pyometra ก็เป็นได้) และการหลุดออกนอกบ้านชวนให้คิดเรื่องตั้งท้อง\n\n## F. เกณฑ์การถาม\n- Must-ask: ทำหมันหรือยัง · เป็นสัดครั้งล่าสุดเมื่อไร · มีโอกาสผสมพันธุ์ไหม · สิ่งคัดหลั่งจากช่องคลอด (สี กลิ่น ปริมาณ) · กินน้ำและฉี่เปลี่ยนไปอย่างไร · ไข้ ซึม อาเจียน · เคยมีปัญหามดลูกหรือระบบสืบพันธุ์ไหม\n- High-value: ยาฮอร์โมน · ประวัติตั้งท้อง · การเปลี่ยนแปลงของท้อง · ความอยากอาหาร · ระดับกิจกรรม · ประวัติรักษา\n- Critical miss: ไม่ถามสถานะทำหมันและเป็นสัดครั้งล่าสุด\n- Safety: สุนัขเมียไม่ทำหมัน ป่วยทั้งตัว และอยู่หลังเป็นสัด ต้องคิดถึง pyometra อย่างจริงจังและมองเป็นเรื่องเร่งด่วน การไม่มีสิ่งคัดหลั่งไม่ตัดโรคออก ห้ามแนะนำให้รอดูอาการหรือให้ยาเองที่บ้าน\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"ซึม กินน้อยลง\" | Lethargy, hyporexia |\n| \"กินน้ำเยอะ ฉี่ท่วม ฉี่ในบ้าน\" | Polydipsia, polyuria (ต้องถามปริมาณ) ± inappropriate urination |\n| \"น้ำข้นๆ เหลืองครีม กลิ่นเหม็น\" | Malodorous purulent vulvar discharge |\n| \"เป็นสัดเมื่อ 7 สัปดาห์ก่อน\" | Last estrus \\~7 weeks ago (อยู่ในช่วง diestrus) |\n| \"ฉีดยาคุมสัดเมื่อ 2 ปีก่อน\" | Previous exogenous progestin administration (\\~2 years ago) |\n| \"ท้องป่อง\" | Mild abdominal distension (owner-reported) |\n\n## H. Key take-away และคำถามชวนคิด\n1. อย่าติดกับ chief complaint: PU/PD มี differential กว้าง ต้องทำ system review ให้ครบ โดยเฉพาะระบบสืบพันธุ์ในเพศเมียที่ไม่ทำหมัน\n2. ใช้ signalment ช่วยคิด: เมีย + ไม่ทำหมัน + อายุมาก + ซึม ควรทำให้ถามเรื่องระบบสืบพันธุ์เร็ว\n3. เจ้าของรู้สึกผิดเรื่องไม่ทำหมัน: Understand before judging และใช้ Affirmation (\"คุณแอนพาน้องมาเร็วแล้วนะคะ\") ส่วนเรื่องผ่าตัดฉุกเฉินและค่าใช้จ่าย ใช้ Ask-Provide-Ask และดูว่าติด COM-B ตรงไหน (มักเป็น Opportunity: เงินและเวลา)\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- ถ้าเจ้าของไม่เอ่ยเรื่องสิ่งคัดหลั่ง คุณจะถามเรื่องนี้อย่างไรให้เป็นธรรมชาติและไม่ตัดสิน\n- PU/PD ในสุนัขสูงอายุมี differential อะไรบ้าง และคำถามไหนช่วยแยกได้เร็วที่สุด\n- ถ้าเจ้าของพูดว่า \"รู้ว่าควรทำหมันตั้งนานแล้ว\" คุณจะตอบอย่างไร (สะท้อนความรู้สึก หรือชื่นชมสิ่งที่เขาทำแล้ว)\n"}, {"file": "05-cat-ckd.md", "md": "---\nid: 05-cat-ckd\ntitle: \"Feline CKD\"\nspecies: cat\nsystem: \"ไต, ต่อมไร้ท่อ\"\nlevel: Intermediate\nquota: 20\nurgency: medium\npersona: \"\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"สโนว์\\\" แมวไทยขาว เพศเมียทำหมัน 13 ปี 3.1 กก. (ปีก่อน 4.0 กก.) เลี้ยงในบ้าน\"\nopening: \"สโนว์ผอมลงเยอะเลยหมอ ช่วงนี้ไม่ค่อยกินข้าว ซึมๆ ค่ะ\"\n---\n\n# เคส 5 — แมวแก่ผอมลง ซึม กินน้อย (Feline CKD)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"สโนว์\" แมวไทยขาว เพศเมียทำหมัน 13 ปี 3.1 กก. (ปีก่อน 4.0 กก.) เลี้ยงในบ้าน |\n| เจ้าของ | คุณป้าแป๋ว อายุ 61 ใจดี แต่จำรายละเอียดไม่ค่อยได้ (Incomplete Recall) มักตอบว่า \"น่าจะ\" \"ไม่แน่ใจ\" |\n| ประโยคเปิด | \"สโนว์ผอมลงเยอะเลยหมอ ช่วงนี้ไม่ค่อยกินข้าว ซึมๆ ค่ะ\" |\n| พูดเองโดยไม่ต้องถาม (V) | ผอมลง กินน้อยลง ซึม (ไม่เอ่ยเรื่องน้ำและฉี่) |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| ระยะเวลา | T | \"ผอมลงมาหลายเดือนแล้วค่ะ ซึมหนักช่วงสัปดาห์สองสัปดาห์นี้\" |\n| น้ำหนัก | S | \"ปีก่อนพาไปฉีดวัคซีน หมอบอกสี่กิโล ตอนนี้ลองอุ้มชั่งกับตัวเอง ได้สามกิโลกว่าๆ ค่ะ\" |\n| การกิน | T | \"เลือกกิน เคี้ยวเม็ดแข็งน้อยลง ชอบเปียกแบบซอง กินได้ครึ่งซอง\" |\n| การดื่มน้ำ | S | \"ชามน้ำต้องเติมบ่อยขึ้นค่ะ จากเดิมเติมวันละครั้ง ตอนนี้ประมาณสามครั้ง\" (ไม่ได้วัดเป็นมิลลิลิตร) |\n| ฉี่ | S | \"ก้อนทรายใหญ่ขึ้นมากค่ะ ต้องตักทุกวัน ก่อนหน้านี้ก้อนเล็กๆ\" (ถ้าถามให้เทียบ: ก้อนเท่ากำปั้น) |\n| อาเจียน | T | \"อ้วกเป็นฟองเหลืองๆ สัปดาห์ละ 2–3 ครั้ง\" |\n| อุจจาระ | T | \"แข็งๆ เล็กๆ ค่ะ ไม่ค่อยออก\" |\n| ปากและกลิ่นปาก | S | \"ปากเหม็นขึ้นนะคะ น้ำลายยืดบางทีเวลาเคี้ยวข้าว\" |\n| ขน | T | \"ขนหยาบ ไม่ค่อยเลียตัวเหมือนเดิม\" |\n| พฤติกรรมและการนอน | T | \"นอนซุกอยู่มุมห้อง ไม่ค่อยลงมาเล่น\" |\n| ตา / การมองเห็น | S | \"วันก่อนเดินชนขอบเตียงค่ะ ไม่แน่ใจว่าตามัวหรือเปล่า\" |\n| ยาและอาหารเสริม | T | \"ไม่ได้ให้ยา\" (ถ้าถามเรื่องของกินอื่น: ให้ขนมแมวเลียทุกวัน) |\n| โรคประจำตัว / ผลเลือดเก่า | U | \"ไม่เคยตรวจเลือดเลยค่ะ ตรวจแค่ตอนทำหมัน\" (รายละเอียดอื่นจำไม่ได้) |\n| ที่พักและสัตว์อื่น | T | \"อยู่บ้านคนเดียว มีแมวอีกตัวสุขภาพดี\" |\n| อาหารที่กินจริง | S | \"อาหารเม็ดยี่ห้อเดิมมาตลอดค่ะ ตอนนี้เสริมซองให้เพราะกลัวไม่กิน\" |\n\nสถานะ Guarded: ถ้านักศึกษาถามแบบสอบสวน (\"ทำไมไม่พามาก่อน\") เจ้าของจะตอบสั้นลง และเลี่ยงเรื่องตรวจเลือดครั้งก่อน เมื่อเจ้าของไม่แน่ใจ ต้องตอบว่าไม่ทราบ ห้ามเดาให้\n\nหมายเหตุผู้เล่น: เจ้าของตอบแบบ \"น่าจะ\" ได้ ต้องให้นักศึกษาใช้วิธีวัดทางอ้อม (ขนาดก้อนทราย จำนวนครั้งเติมน้ำ) แทนการคาดคั้นตัวเลข\n\n## C. ตรวจร่างกายเบื้องต้น\nBCS 2/9 · T 37.9 °C · HR 170 · RR 32 · เยื่อเมือกซีด ขาดน้ำประมาณ 7% · ไตทั้งสองข้างคลำได้เล็กและขรุขระ · ช่องปากมีแผลที่ลิ้นและเหงือกอักเสบ · BP 190 mmHg (Doppler) · จอประสาทตาพบเลือดออกเล็กน้อย\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| BUN | 78 mg/dL | 15–34 |\n| Creatinine | 4.1 mg/dL | 0.8–2.1 |\n| SDMA | 28 µg/dL | \u003c14 |\n| Phosphorus | 8.2 mg/dL | 3.0–6.0 |\n| K | 3.1 mmol/L | 3.5–5.5 (hypokalemia พบได้ใน CKD แมว) |\n| PCV | 21% | 30–45 (non-regenerative anemia) |\n| Total T4 | 2.2 µg/dL | 1.0–4.0 (ปกติ ตัด hyperthyroidism ที่พรางไต) |\n| Glucose | 112 mg/dL | ปกติ ตัด DM |\n| Urinalysis | USG 1.014 | ปัสสาวะเจือจางทั้งที่ขาดน้ำ UPC 0.6 (borderline proteinuria) |\n| X-ray / US | ไตเล็ก ขอบขรุขระ เสียโครงสร้างชั้นเปลือก-ไส้ไต | ไม่พบนิ่ว |\n\n## E. เฉลยลับ\n- โรค: Chronic kidney disease, IRIS stage 3 (Cr 4.1 mg/dL, SDMA 28 µg/dL) ร่วมกับ systemic hypertension, anemia of CKD, uremic stomatitis, hypokalemia (ผู้สอนปรับ stage ตามเกณฑ์สถาบัน)\n- Differential: hyperthyroidism, diabetes mellitus, pyelonephritis, urolithiasis, neoplasia (renal lymphoma), pancreatitis, FIV/FeLV\n- ตัวลวง: ผอมลงทำให้เสี่ยงหลงไป hyperthyroidism หรือมะเร็ง เจ้าของพูดถึงน้ำและฉี่น้อยมาก ถ้าไม่ถาม PU/PD จะพลาดเบาะแสสำคัญ ขนมเลียทุกวันอาจเป็นแหล่งโซเดียมและฟอสฟอรัส (ผู้สอนยืนยันได้)\n\n## F. เกณฑ์การถาม\n- Must-ask: น้ำหนักเปลี่ยนไปเท่าไรและกี่เดือน · ปริมาณน้ำที่กินและฉี่เปลี่ยนไปอย่างไร (ให้ใช้ตัวเทียบ) · อาเจียนและความถี่ · ความอยากอาหารและชนิดอาหาร · ยาและอาหารเสริมที่ให้เอง\n- High-value: กลิ่นปาก/น้ำลายยืด · ตามัวหรือเดินชน · ท้องผูก · ประวัติผลเลือดก่อนหน้านี้ · อายุและโรคเดิม · มีสัตว์เลี้ยงอื่นหรือไม่\n- Critical miss: ไม่แยกอาการ PU/PD ออกจากน้ำหนักลด (ทำให้ไม่ได้คิดโรคไต/DM/hyperthyroid อย่างเป็นระบบ)\n- Safety: แมวชราที่ซึม ผอม กินน้อย อาเจียน ต้องจัดเป็นเคสที่ต้องรีบตรวจเลือดและวัดความดัน ห้ามแนะนำให้บังคับป้อนอาหารเองที่บ้านก่อนได้ประเมิน และห้ามแนะนำให้ยาแก้อาเจียนหรือยาแก้ปวดของคนกินเอง นักศึกษาต้องไม่บอกเจ้าของว่า \"แก่แล้วก็เป็นแบบนี้\"\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"ผอมลง ตัวเบาลง\" | Weight loss \\~22% ใน 12 เดือน (4.0 → 3.1 กก.) |\n| \"ชามน้ำเติมบ่อยขึ้น ก้อนทรายใหญ่ขึ้น\" | Polydipsia and polyuria (semi-quantified, \\~3× water refills/day) |\n| \"อ้วกเป็นฟองเหลืองๆ\" | Intermittent bilious vomiting 2–3×/week |\n| \"ปากเหม็น น้ำลายยืด\" | Halitosis, ptyalism (uremic stomatitis) |\n| \"ขนหยาบ ไม่เลียตัว\" | Poor coat condition, reduced grooming |\n| \"เดินชนขอบเตียง\" | Possible visual impairment (hypertensive retinopathy) |\n| \"เลือกกิน กินครึ่งซอง\" | Hyporexia with food preference |\n\n## H. Key take-away และคำถามชวนคิด\n1. แยกอาการร่วมออกจากกัน: น้ำหนักลด, PU/PD และอาเจียนเป็น problem คนละข้อ แล้วค่อยหา differential ที่ตอบได้ทั้งหมด\n2. ทำให้คำคลุมเครือเป็นตัวเลข: เมื่อเจ้าของวัดไม่ได้ ให้ถามตัวเทียบ (ก้อนทรายเท่ากำปั้น เติมน้ำกี่ครั้งต่อวัน) แล้วบันทึกว่าเป็นค่าประมาณ\n3. \"แก่แล้ว\" ไม่ใช่ข้อมูลทางคลินิก: ต้องถามต่อว่าเปลี่ยนไปอย่างไรจากเมื่อก่อน และใช้ Ask-Provide-Ask กับเจ้าของที่ความจำไม่ชัด ให้เขารู้สึกว่าตอบได้โดยไม่ผิด\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- ถ้าเจ้าของไม่พูดเรื่องน้ำและฉี่เลย คุณจะรู้ได้อย่างไรว่าต้องถาม\n- ผอมลงกับกินน้อยลง ต่างกันตรงไหนในแง่ differential\n- เจ้าของตอบว่า \"ไม่แน่ใจ\" คุณจะวัดทางอ้อมด้วยคำถามไหน และบันทึกอย่างไรไม่ให้ดูเหมือนข้อมูลแน่นอน\n"}, {"file": "06-dog-ehrlichiosis.md", "md": "---\nid: 06-dog-ehrlichiosis\ntitle: \"Canine monocytic ehrlichiosis\"\nspecies: dog\nsystem: \"เลือด, เห็บ\"\nlevel: Intermediate\nquota: 20\nurgency: high\npersona: \"\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"ข้าวปั้น\\\" สุนัขพันธุ์ผสม เพศผู้ทำหมันแล้ว 5 ปี 22 กก. เลี้ยงกึ่งในบ้านกึ่งนอกบ้าน\"\nopening: \"น้องเลือดกำเดาไหลเมื่อเช้าค่ะ/ครับ แล้วก็ซึมๆ มาสองสามวัน ไม่ค่อยกินข้าว\\\" (ใช้สรรพนามตามเพศเจ้าของที่อาจารย์กำหนด)\"\n---\n\n# เคส 6 — สุนัขเลือดกำเดาไหล ซึม (Canine monocytic ehrlichiosis)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"ข้าวปั้น\" สุนัขพันธุ์ผสม เพศผู้ทำหมันแล้ว 5 ปี 22 กก. เลี้ยงกึ่งในบ้านกึ่งนอกบ้าน |\n| เจ้าของ | คุณต้น อายุ 38 ใจดีและให้ความร่วมมือ (Cooperative) แต่งานยุ่ง ตอบเร็วและสั้น ถ้าไม่ถูกถามจะไม่เล่าเรื่องที่ตัวเองไม่แน่ใจว่าสำคัญ |\n| ประโยคเปิด | \"น้องเลือดกำเดาไหลเมื่อเช้าค่ะ/ครับ แล้วก็ซึมๆ มาสองสามวัน ไม่ค่อยกินข้าว\" (ใช้สรรพนามตามเพศเจ้าของที่อาจารย์กำหนด) |\n| พูดเองโดยไม่ต้องถาม (V) | เลือดกำเดาไหลเมื่อเช้า ซึมสองสามวัน กินน้อยลง |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| เลือดกำเดา | V | \"ไหลข้างเดียวครับ ไหลเป็นหยดๆ ประมาณสิบนาทีแล้วหยุดเอง แต่เย็นนี้ไหลอีกรอบ\" |\n| ซึมและการกิน | T | \"ซึมมาประมาณ 3 วัน กินได้ครึ่งนึง ยังเดินเล่นได้ แต่ไม่ค่อยวิ่ง\" |\n| รอยจ้ำเลือด | S | \"เพิ่งสังเกตว่าท้องมีจุดแดงๆ เล็กๆ ตรงที่ขนบาง ไม่ได้เอะใจมาก่อน\" |\n| เหงือก / ขี้ | S | \"เหงือกซีดลงนิดหน่อย ขี้เมื่อวานสีเข้มกว่าปกติ\" (ไม่แน่ใจว่าดำหรือเปล่า) |\n| เห็บหมัด | S | \"มีเห็บอยู่บ้างครับ เมื่อสามสัปดาห์ก่อนเห็นเกาะที่หู เด็ดออกไปหลายตัว\" |\n| การป้องกันเห็บหมัด | S | \"ใส่ยาหยดหลังคอมาตลอดนะ แต่ช่วงหลังลืมไปหลายเดือน ไม่แน่ใจว่าหยดครั้งสุดท้ายเมื่อไหร่\" |\n| การเดินทางหรือพื้นที่เสี่ยง | S | \"เมื่อ 3 สัปดาห์ก่อนพาไปเที่ยวบ้านญาติต่างจังหวัด ปล่อยวิ่งในสวน\" |\n| ยาที่ให้เอง | S | \"เมื่อวานเห็นน้องซึม กลัวปวดเลยให้พาราไปครึ่งเม็ด ตอนเช้าให้ยาแก้ปวดที่ผมกินอยู่ (ไอบูโพรเฟน) อีกครึ่งเม็ด\" (เล่าเฉพาะเมื่อถูกถามเรื่องยาทุกชนิดที่ให้เอง) |\n| โอกาสกินยาเบื่อหนู | S | \"บ้านญาติมีกับดักหนูครับ แต่ไม่เห็นน้องกินอะไร\" (ต้องถามตรงๆ จึงตอบ) |\n| อาเจียน / ท้องเสีย | T | \"อ้วกครั้งเดียวเมื่อวาน เป็นน้ำเหลืองๆ ไม่มีเลือด\" |\n| ปัสสาวะ | T | \"ปกติครับ ไม่เห็นสีแดง\" |\n| โรคเดิม / วัคซีน | T | \"ไม่เคยป่วยหนักครับ วัคซีนรวมครบปีที่แล้ว\" |\n| ผลเลือดเดิม | U | \"ไม่เคยตรวจเลือดเลยครับ\" |\n| สัตว์อื่นในบ้าน | T | \"มีหมาอีกตัว ตัวนั้นปกติครับ\" |\n\nสถานะ Guarded: ถ้านักศึกษาตำหนิเรื่องลืมหยอดยากันเห็บหรือเรื่องให้ยาเอง เจ้าของจะตอบสั้นลงและลดการเล่าเรื่องยาที่ให้เอง\n\n## C. ตรวจร่างกายเบื้องต้น\nT 39.6 °C · HR 130 · RR 32 · เยื่อเมือกซีดชมพู · CRT 2 วินาที · ต่อมน้ำเหลืองใต้คางและหน้าไหล่โตเล็กน้อย · ม้ามคลำได้ใหญ่เล็กน้อย · petechiae ที่ท้องและขาหนีบ · เห็บเกาะ 2 ตัวที่ใบหู · ไม่พบเลือดสดที่ทวาร มีอุจจาระเปื้อนสีเข้มที่ปลายอุณหภูมิวัดทางทวารหนัก · ไม่พบข้อบวมหรือปวด\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| Platelet | 18 ×10³/µL | 200–500 (severe thrombocytopenia) |\n| PCV / Hct | 24% | 37–55 (non-regenerative anemia ระยะเฉียบพลันถึงกึ่งเรื้อรัง) |\n| WBC | 5.2 ×10³/µL | 6–17 (ต่ำเล็กน้อย) |\n| Total protein / Globulin | 8.6 / 5.4 g/dL | TP 5.4–7.5, Glob 2.5–4.5 (hyperglobulinemia) |\n| Albumin | 2.5 g/dL | 2.6–4.0 (ต่ำเล็กน้อย) |\n| ALT / ALP | 98 / 140 U/L | ขึ้นเล็กน้อย |\n| BUN / Creatinine | 24 / 1.1 mg/dL | ปกติ |\n| PT / aPTT | ปกติ | ไม่สนับสนุน anticoagulant rodenticide |\n| 4Dx Plus | Ehrlichia canis Ab บวก; Anaplasma, Lyme, Heartworm ลบ | ผลบวกแปลว่าเคยสัมผัสเชื้อ ต้องดูร่วมกับอาการและผลเลือด |\n| Blood smear | ไม่พบ morula ชัดเจน | ความไวต่ำ ไม่ตัดโรคทิ้ง |\n| Imaging | X-ray ทรวงอกปกติ US: ม้ามโตเล็กน้อย เนื้อสม่ำเสมอ | — |\n\n## E. เฉลยลับ\n- โรค: Canine monocytic ehrlichiosis (Ehrlichia canis) ระยะ acute-to-subclinical ร่วมกับ thrombocytopenia รุนแรงและเลือดออกเยื่อเมือก\n- Differential: Anaplasma platys, babesiosis, IMT / IMHA, anticoagulant rodenticide, NSAID-related GI bleeding และ platelet dysfunction, DIC, neoplasia (lymphoma, hemangiosarcoma)\n- ตัวลวง: ยาแก้ปวดที่เจ้าของให้เองทำให้คิดเรื่องพิษยา/NSAID ได้ (ซึ่งอาจเป็นปัจจัยซ้ำเติมเลือดออกทางเดินอาหารและต้องบันทึก) กับดักหนูที่บ้านญาติ ทำให้คิดถึง rodenticide ซึ่ง PT/aPTT ปกติช่วยตัดออก ต้องไม่ตัดสินจากชุดตรวจ 4Dx อย่างเดียว\n\n## F. เกณฑ์การถาม\n- Must-ask: เห็บและการป้องกันเห็บ · ประวัติเดินทาง/พื้นที่เสี่ยง · ยาและอาหารเสริมทุกชนิดที่ให้เอง · โอกาสกินพิษหนู · เลือดออกที่อื่น (อุจจาระ ปัสสาวะ อาเจียน) · สัตว์อื่นในบ้าน\n- High-value: ไทม์ไลน์ของอาการ · วัคซีน · อาหาร · เคยตรวจเลือดหรือเคยป่วยหรือไม่ · รอยจ้ำ/เหงือก\n- Critical miss: ไม่ถามเห็บ/การป้องกันเห็บ และไม่ถามพิษ (rodenticide) หรือยาที่ให้เอง\n- Safety: สุนัขเลือดออกต้องคิดเรื่องความรุนแรงและการห้ามเลือดก่อน นักศึกษาต้องไม่แนะนำให้เจ้าของให้ยาแก้ปวดคน/NSAID ต่อ และต้องไม่ตัดสินเจ้าของที่ให้ยาเอง\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"เลือดกำเดาไหลข้างเดียว\" | Unilateral epistaxis, recurrent |\n| \"ท้องมีจุดแดงๆ\" | Petechiae, ventral abdomen and inguinal area |\n| \"ขี้สีเข้ม\" | Possible melena (ต้องยืนยันด้วยการตรวจ) |\n| \"เห็บเกาะหู ลืมหยดยา\" | Tick exposure with inadequate ectoparasite prevention |\n| \"ไปเที่ยวต่างจังหวัด 3 สัปดาห์ก่อน\" | Travel/exposure 3 weeks before onset (ช่วงฟักตัวสอดคล้อง) |\n| \"ให้พารากับยาแก้ปวดของคนกิน\" | Owner-administered ibuprofen (human NSAID), 1–2 doses \\~24 h |\n| \"ซึม กินครึ่งหนึ่ง\" | Lethargy, hyporexia (\\~50%) × 3 days |\n\n## H. Key take-away และคำถามชวนคิด\n1. เห็บคือข้อมูลชี้ขาด: ถามเรื่องเห็บ การป้องกัน และพื้นที่เสี่ยงในทุกเคสที่มีเลือดออกหรือซึมในสุนัขในพื้นที่เขตร้อน\n2. ถามยาที่เจ้าของให้เองให้ครบ รวมยาคนและอาหารเสริม เพราะเจ้าของมักไม่นับว่าเป็น \"ยา\" และอาจเป็นปัจจัยซ้ำเติมโรค\n3. สร้างพื้นที่ปลอดภัยก่อนถามเรื่องที่เจ้าของรู้สึกผิด: ใช้ Affirmation และ Reflection แทนการตำหนิ แล้วเจ้าของจะเล่ามากขึ้น (Understand before judging)\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- ถ้าไม่ถามเรื่องยาที่ให้เอง คุณจะพลาดอะไรในการแยกโรค\n- ผล 4Dx บวกอย่างเดียว พอจะสรุปว่านี่คือสาเหตุของอาการหรือไม่ เพราะอะไร\n- ถ้าเจ้าของบอกว่า \"ไม่มีเห็บ\" คุณจะถามต่ออย่างไรโดยไม่ให้เจ้าของรู้สึกถูกตรวจสอบ\n"}, {"file": "07-dog-mmvd-chf.md", "md": "---\nid: 07-dog-mmvd-chf\ntitle: \"MMVD with congestive heart failure\"\nspecies: dog\nsystem: \"หัวใจ, หายใจ\"\nlevel: Intermediate\nquota: 20\nurgency: high\npersona: \"\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"โทบี้\\\" คาวาเลียร์ คิงชาลส์ สแปเนียล เพศผู้ทำหมันแล้ว 11 ปี 8.2 กก. เลี้ยงในบ้าน ปรับอากาศ\"\nopening: \"หมาไอตอนกลางคืนครับหมอ ไอมาเป็นเดือนแล้ว แก่แล้วก็คงเป็นแบบนี้\"\n---\n\n# เคส 7 — สุนัขแก่ไอตอนกลางคืน นอนหอบ (MMVD with congestive heart failure)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"โทบี้\" คาวาเลียร์ คิงชาลส์ สแปเนียล เพศผู้ทำหมันแล้ว 11 ปี 8.2 กก. เลี้ยงในบ้าน ปรับอากาศ |\n| เจ้าของ | คุณลุงสมชาย อายุ 67 ความรู้ทางการแพทย์น้อย (Low Medical Literacy) ใช้คำชาวบ้าน พูดว่า \"แก่แล้ว\" บ่อย ไม่ได้นับอะไรเป็นตัวเลข |\n| ประโยคเปิด | \"หมาไอตอนกลางคืนครับหมอ ไอมาเป็นเดือนแล้ว แก่แล้วก็คงเป็นแบบนี้\" |\n| พูดเองโดยไม่ต้องถาม (V) | ไอกลางคืน ไอมาเป็นเดือน เชื่อว่าเพราะแก่ |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| ลักษณะการไอ | T | \"ไอแห้งๆ เหมือนมีอะไรติดคอ ไอตอนจะนอนกับตอนตีสามตีสี่\" |\n| ความถี่ | S | \"คืนละสองสามที ช่วงนี้ไอยาวขึ้น\" |\n| ไอตอนกลางวัน / ออกกำลัง | S | \"เดินเล่นแป๊บเดียวก็เหนื่อย แต่ผมคิดว่าแก่\" |\n| การหายใจตอนนอนหลับ | U | \"ไม่เคยนับครับ เห็นท้องขึ้นลงเร็วๆ บางทีแต่ไม่รู้ว่าเร็วแค่ไหน\" (ต้องสอนให้นับถึงจะได้ตัวเลข) |\n| ท่านอน | S | \"ช่วงหลังไม่ค่อยนอนราบ นอนหนุนหมอนหรือนั่งหลับ\" |\n| กินอาหาร | T | \"กินน้อยลงนิดหน่อย\" |\n| น้ำหนัก | S | \"ผอมลงที่ตัว แต่ท้องดูป่องๆ\" (cardiac cachexia + อาจมีน้ำในท้องเล็กน้อย) |\n| เป็นลม / ล้มพับ | S | \"เมื่อสัปดาห์ก่อนเดินแล้วขาอ่อนล้มไปทีหนึ่ง แป๊บเดียวก็ลุก\" |\n| เหงือก / ลิ้น | S | \"บางทีดูม่วงๆ ตอนไอหนักครับ\" |\n| ประวัติหัวใจ | T | \"หมอเคยบอกว่ามีเสียงฟู่ที่หัวใจ เมื่อสามปีก่อน ไม่ได้ติดตามต่อ\" |\n| ยาที่ให้อยู่ | T | \"ยาประจำไม่มีครับ มีแต่ยาแก้ไอ (ยาละลายเสมหะ) ที่ซื้อมาให้เองเมื่อสัปดาห์ก่อน ไม่ดีขึ้น\" |\n| ยาป้องกันพยาธิหนอนหัวใจ | T | \"หยอดบ้างลืมบ้าง\" |\n| ไข้ / น้ำมูก / สัมผัสสุนัขอื่น | T | \"ไม่มีครับ อยู่บ้านตัวเดียว\" |\n| เกลือและอาหารที่กิน | S | \"กินอาหารเม็ดกับให้ไส้กรอกเป็นรางวัลทุกวัน\" |\n| เหตุผลที่มาตอนนี้ | S | \"เมื่อคืนไอจนไม่ได้นอน หอบ ตัวสั่น กลัวว่าจะแย่\" |\n\nสถานะ Guarded: ถ้านักศึกษาใช้ศัพท์แพทย์หรือตัดสินว่า \"มาช้า\" เจ้าของจะเงียบ และตอบแค่ \"ก็แก่แล้วครับ\" โดยไม่ให้รายละเอียดเรื่องการหอบและเป็นลม\n\nหมายเหตุผู้เล่น: ถ้านักศึกษาไม่ถามเรื่องการหายใจตอนนอน เจ้าของจะไม่พูดเอง แต่ถ้านักศึกษาสอนให้นับ (\"ตอนหลับ ท้องขึ้นลงกี่ครั้งใน 1 นาที\") เจ้าของจะตอบว่ายังไม่เคยนับ แต่จะลองนับให้ในคืนนี้ ซึ่งนับเป็น teach-back ที่ดี\n\n## C. ตรวจร่างกายเบื้องต้น\nBCS 3/9 (muscle loss) · T 38.3 °C · HR 168 irregular-ish · RR 52 (หอบ ใช้กล้ามเนื้อหน้าท้องช่วย) · เยื่อเมือกชมพูอมเทา CRT 2 วินาที · เสียงฟู่หัวใจ grade IV/VI ที่ปลายหัวใจซ้าย · ปอดมี crackles ทั้งสองข้าง · ชีพจรอ่อนเป็นช่วง · ท้องมี free fluid เล็กน้อย · หลอดเลือดดำที่คอโป่งเล็กน้อย\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| X-ray ทรวงอก | VHS 12.6 ; LA โต ; pulmonary edema ที่บริเวณ perihilar และ caudodorsal ; pulmonary vein โต | VHS อ้างอิงทั่วไป \\~9.7 ± 0.5 (ขึ้นกับสายพันธุ์ CKCS มักสูงกว่าค่าทั่วไป ผู้สอนเลือกค่าอ้างอิงตามเกณฑ์สถาบัน) |\n| Echo | LA:Ao 2.1 ; ลิ้น mitral หนา มี prolapse ; MR jet ขนาดใหญ่ | LA:Ao \u003c1.6 |\n| NT-proBNP | สูงกว่าช่วงอ้างอิงของห้องปฏิบัติการ (ค่าสมมติ \\~2,400 pmol/L, อ้างอิง \u003c900) | ช่วยแยกโรคหัวใจจากโรคทางเดินหายใจ |\n| CBC | PCV 40% ; WBC 12.0 | ปกติ |\n| Chem | BUN 38 ; Cr 1.3 ; ALT 60 ; Na 140 ; K 4.4 | BUN ขึ้นเล็กน้อยจาก low output ; baseline ก่อนให้ยาขับปัสสาวะ |\n| BP | 130 mmHg | ปกติ |\n| ECG | sinus tachycardia ; มี VPC บางช่วง | — |\n| Heartworm Ag | ลบ | ช่วยตัดสินแต่ไม่ตัดโรคอื่น |\n\n## E. เฉลยลับ\n- โรค: Myxomatous mitral valve disease (MMVD) ACVIM stage C ร่วมกับ congestive heart failure ที่มี cardiogenic pulmonary edema\n- Differential: dilated cardiomyopathy, pericardial effusion, collapsing trachea / chronic bronchitis, pneumonia, heartworm disease, pulmonary hypertension, laryngeal paralysis\n- ตัวลวง: เจ้าของให้ยาแก้ไอเอง และเชื่อว่า \"แก่แล้วไอ\" ทำให้ประวัติสำคัญหายไป ไส้กรอกเป็นแหล่งโซเดียม (ผู้สอนยืนยันได้) เสียงฟู่เก่า 3 ปีเป็นเบาะแสที่เจ้าของไม่ได้ให้ความสำคัญ\n\n## F. เกณฑ์การถาม\n- Must-ask: การหายใจตอนพัก/ตอนหลับ (อัตรา ความลำบาก ท่านอน) · ลักษณะและเวลาไอ · เหนื่อยง่ายหรือเป็นลม · ประวัติเสียงฟู่หรือโรคหัวใจ · ยาที่ให้เอง · อาหารและขนมที่กิน\n- High-value: ไอแห้ง/เสมหะ · ไข้ · ประวัติหนอนหัวใจ · ความอยากอาหาร · น้ำหนัก\n- Critical miss: ไม่ถามเรื่องการหายใจตอนพักและความลำบากในการหายใจ ซึ่งเป็นตัวชี้ว่าต้องรีบทำให้คงที่ก่อนตรวจต่อ\n- Safety: สุนัขที่หอบหนักต้องไม่ถูกจับตรึงหรือเครียดเกินจำเป็น นักศึกษาต้องไม่แนะนำให้เจ้าของรอสังเกตอาการที่บ้าน และต้องไม่แนะนำยาแก้ไอ/ยาขับเสมหะต่อ รวมทั้งไม่ตัดสินเจ้าของว่า \"มาช้า\"\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"ไอตอนกลางคืน เหมือนมีอะไรติดคอ\" | Nocturnal dry cough, \\~1 month, progressive |\n| \"เดินแป๊บเดียวเหนื่อย\" | Exercise intolerance |\n| \"ไม่ค่อยนอนราบ นั่งหลับ\" | Orthopnea |\n| \"ท้องขึ้นลงเร็ว\" | Tachypnea (ยังไม่ได้วัด sleeping respiratory rate ; owner has not counted) |\n| \"เดินแล้วขาอ่อนล้ม\" | Episode of syncope / collapse \\~1 week ago |\n| \"ผอมลงแต่ท้องป่อง\" | Muscle wasting (cardiac cachexia) with abdominal distension |\n| \"หมอเคยบอกว่ามีเสียงฟู่\" | Known heart murmur 3 years ago, no follow-up |\n| \"ยาแก้ไอที่ซื้อเอง\" | Owner-administered OTC expectorant, no response |\n\n## H. Key take-away และคำถามชวนคิด\n1. คำว่า \"แก่แล้ว\" ไม่ใช่ข้อมูล: ป้ายของเจ้าของไม่ใช่ข้อมูลทางคลินิก ให้ถามต่อว่า \"แก่แล้วเป็นยังไงบ้าง\" แล้วแยกเป็นอาการ เวลา และความถี่\n2. อัตราการหายใจตอนพักคือตัวชี้ที่ดีที่สุดที่เจ้าของทำเองได้: สอนให้เจ้าของนับ (teach-back) และให้เกณฑ์ที่ชัดเจนว่าเมื่อไรต้องรีบมา\n3. ภาษาที่เข้าใจง่ายสำคัญกว่าศัพท์ถูกต้อง: ถามด้วยคำง่าย ๆ เช่น \"ตอนนอน หมาหายใจเร็วไหม ท้องขึ้นลงเร็วไหม\" ใช้ Ask-Provide-Ask ตรวจความเข้าใจ\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- เจ้าของบอกว่า \"แก่แล้ว\" คุณจะถามต่อว่าอะไรให้ได้ข้อมูลที่ใช้ได้\n- ข้อมูลใดที่ทำให้แยกโรคหัวใจออกจากโรคหลอดลมเรื้อรังได้เร็วที่สุด\n- คุณจะสอนเจ้าของนับการหายใจตอนหลับด้วยประโยคอะไร และจะตรวจว่าเขาเข้าใจอย่างไร\n"}, {"file": "08-cat-permethrin.md", "md": "---\nid: 08-cat-permethrin\ntitle: \"Permethrin toxicosis\"\nspecies: cat\nsystem: \"พิษวิทยา, ประสาท\"\nlevel: Advanced\nquota: 30\nurgency: high\npersona: \"\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"ลูน่า\\\" แมวไทยผสม เพศเมียทำหมัน 2 ปี 3.8 กก. เลี้ยงในบ้าน\"\nopening: \"หมอช่วยด้วยค่ะ น้องสั่นๆ เดินเซๆ น้ำลายไหลเยอะมาก เป็นอะไรคะ\"\n---\n\n# เคส 8 — แมวสั่น น้ำลายไหล หลังหยดยากำจัดเห็บ (Permethrin toxicosis)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"ลูน่า\" แมวไทยผสม เพศเมียทำหมัน 2 ปี 3.8 กก. เลี้ยงในบ้าน |\n| เจ้าของ | คุณมิน อายุ 29 ตื่นตะหนกและกังวลมาก (Anxious) พูดเร็วและข้ามลำดับเหตุการณ์ ร่วมกับความจำไม่ครบ (Incomplete Recall) เพราะตื่นเต้น |\n| ประโยคเปิด | \"หมอช่วยด้วยค่ะ น้องสั่นๆ เดินเซๆ น้ำลายไหลเยอะมาก เป็นอะไรคะ\" |\n| พูดเองโดยไม่ต้องถาม (V) | สั่น เดินเซ น้ำลายไหล (ไม่พูดเรื่องยาหยดเอง) |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| ระยะเวลา | T | \"เริ่มเมื่อประมาณห้าชั่วโมงก่อนค่ะ แล้วก็สั่นแรงขึ้นเรื่อยๆ\" |\n| อาการสั่น | S | \"สั่นทั้งตัว บางทีหูกระตุก ตากระพริบ\" |\n| น้ำลาย / อาเจียน | T | \"น้ำลายไหลเยิ้ม อ้วกครั้งเดียวค่ะ\" |\n| การเดิน | T | \"เดินเซๆ เหมือนเมา ล้มใส่ผนังหลายครั้งค่ะ\" |\n| ยา / สารเคมีที่ใช้ | S | \"เมื่อเช้าหยดยากำจัดเห็บให้ค่ะ แต่ลืมบอกหมอตอนโทร คิดว่าไม่น่าเกี่ยว\" (เล่าเฉพาะเมื่อถูกถามเรื่องยา/สารเคมี/สิ่งที่ทาหรือหยด) |\n| ยี่ห้อ / ผลิตภัณฑ์ | S | \"จำชื่อไม่ได้ค่ะ หลอดสีแดงเป็นของสุนัข ซื้อมาจากร้านขายอาหารสัตว์ เก็บหลอดไว้ที่บ้านค่ะ\" (ไม่ได้บอกเองว่าเป็นยาสำหรับสุนัขเท่านั้น ต้องถามชนิดสัตว์ที่ใช้) |\n| ปริมาณที่ใช้ | S | \"บีบทั้งหลอดเลยค่ะ แล้วไปทาตรงหลังคอให้ทั่วหลัง\" |\n| เวลาที่หยด | S | \"ประมาณห้าชั่วโมงก่อนอาการเริ่มค่ะ พอประมาณบ่ายสามทุ่ม\" |\n| เหตุผลที่ใช้ | S | \"เจอเห็บตัวหนึ่งที่คอ เลยคิดว่าหยดยาสุนัขที่บ้านก็คงใช้ได้\" |\n| การเลีย/สัมผัสยา | S | \"เลียตัวหลังหยดนิดหน่อย แล้วก็น้ำลายไหล\" |\n| สัตว์อื่น / สุนัขในบ้าน | T | \"มีหมาอีกตัวค่ะ ยาหยดหลอดเดียวกันนั้นแหละค่ะ\" |\n| ยาอื่น / พิษอื่นในบ้าน | T | \"ไม่มีค่ะ ไม่มียาฆ่าแมลง น้องไม่ได้ออกนอกบ้านค่ะ\" |\n| ประวัติป่วยเดิม | T | \"แข็งแรงมากค่ะ ฉีดวัคซีนครบ\" |\n| คำถามจากเจ้าของล่อนนักศึกษา | — | \"ทำให้อ้วกดีไหมคะ\" / \"ให้กินนมหรือป่าวคะ\" / \"อาบน้ำให้ได้ไหม\" (ทดสอบการแนะนำที่ปลอดภัย) |\n\nสถานะ Guarded: ถ้านักศึกษาตำหนิ (\"ทำไมใช้ยาสุนัขกับแมว\") เจ้าของจะร้องไห้และพูดน้อยลง นักศึกษาต้องทำให้เจ้าของใจเย็นและย้ำว่าการบอกเรื่องยาช่วยให้รักษาได้เร็วขึ้น การไม่ตำหนิคือส่วนหนึ่งของการได้ข้อมูล\n\nหมายเหตุผู้เล่น: เจ้าของจะยืนยันชื่อยาได้เมื่อถูกถามว่ามีป้าย/รูปของหลอดไหม และจะอ่านป้ายให้ฟังเมื่อนักศึกษาขอให้ส่งรูปหรืออ่านป้าย และจะปรากฏในผลตรวจทาง (ป้าย : permethrin 45% ระบุ \"สำหรับสุนัขเท่านั้น\")\n\n## C. ตรวจร่างกายเบื้องต้น\nT 39.7 °C · HR 220 · RR 48 · เยื่อเมือกชมพู CRT 2 วินาที · hypersalivation · muscle fasciculation ทั่วตัว · ataxia · ม้านตาขยาย (mydriasis) ถ้ามี · มีกลิ่นสารเคมีจางๆ บริเวณหลังคอ ผมชื้นสามชั่วโมงและกล้ามเนื้อกระตุก · ไม่มีอาการชักเกร็งในขณะตรวจ\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| CK | 2,400 U/L | \u003c300 (บ่งชี้กล้ามเนื้อถูกทำลายจากการสั่น) |\n| Glucose | 162 mg/dL | เพิ่มเล็กน้อยจากความเครียดและการสั่น |\n| ALT / AST | 70 / 120 U/L | ขึ้นเล็กน้อยจากกล้ามเนื้อ |\n| BUN / Cr | 22 / 1.0 mg/dL | ปกติ |\n| K / Ca / Mg | 3.7 / 9.4 / 2.0 | ปกติ |\n| Blood gas | เล็กน้อย metabolic acidosis (lactate 4.2) | จากการสั่นและ hyperthermia |\n| CBC | WBC 15.0 (stress leukogram), PCV 38% | — |\n| Cholinesterase | ไม่ส่งตรวจ / อยู่ในช่วงปกติ | ช่วยลดความเป็นไปได้ของ OP/carbamate แต่ไม่ใช่การยืนยัน และไม่ใช่ผลที่คลินิกส่วนใหญ่ทำได้ทันที |\n| X-ray | ทรวงอกและช่องท้องปกติ | ไม่พบสิ่งแปลกปลอม |\n\n## E. เฉลยลับ\n- โรค: Permethrin (pyrethroid) toxicosis จากยาหยดกำจัดเห็บที่ผลิตสำหรับสุนัข (แมวไวต่อสารนี้มาก)\n- Differential: organophosphate / carbamate toxicosis, metaldehyde, strychnine, สารคลุมในไม้หรือพืชพิษ อื่น ๆ และความผิดปกติของระบบประสาท (เช่น hypoglycemia, hepatic encephalopathy, โรคระบบประสาทส่วนกลาง) แต่ประวัติไม่สอดคล้อง\n- ตัวลวง: อาการดูเหมือน organophosphate (น้ำลายไหล) จึงอาจทำให้คิดชนิดสารผิด เจ้าของที่ตื่นเต้นไม่บอกเรื่องยาหยดเองเอง และคำถามที่เจ้าของถามกลับเป็นกับดักคำแนะนำที่ไม่ปลอดภัย\n\n## F. เกณฑ์การถาม\n- Must-ask: สารเคมี ยา หยด สเปรย์ ผลิตภัณฑ์ที่ทาหรือสัมผัส · ชนิดสัตว์ที่ผลิตภัณฑ์ออกแบบไว้ให้ใช้ · เวลาที่สัมผัส · ปริมาณ · การเลีย · อาการเริ่มเมื่อไร · สารพิษอื่นในบ้าน\n- High-value: ขอดูป้ายหรือรูปของผลิตภัณฑ์ · สัตว์ตัวอื่นในบ้าน · ทำอะไรไปแล้วบ้างหลังเกิดอาการ (อาบน้ำ ป้อนอะไร) · อาการจากช็อก\n- Critical miss: ไม่ถามเรื่องสารเคมี/ยาที่สัมผัส หรือไม่ทราบชนิดสัตว์ที่ผลิตภัณฑ์ไว้ให้ใช้\n- Safety (สำคัญที่สุดในเคสนี้): ห้ามแนะนำให้เจ้าของทำให้อาเจียน ป้อนนม ป้อนน้ำ หรือให้ยาใด ๆ ที่บ้านในแมวที่สั่นและอาจชัก และต้องให้คำแนะนำเรื่องการชำระสารพิษเท่าที่แพทย์ผู้ปฏิบัติการควบคุมในคลินิกและอยู่ในกรอบที่คณาจารย์กำหนด (คณาจารย์ต้องกำหนดคำตอบมาตรฐานของสถาบัน) นักศึกษาต้องแจ้งความเร่งด่วนและขอให้เปิดลำดับการรักษาทันทีหลังได้ข้อมูลสำคัญ\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"สั่นทั้งตัว หูกระตุก\" | Generalized tremors / muscle fasciculations, ear twitching |\n| \"เดินเซ ล้ม\" | Ataxia, incoordination |\n| \"น้ำลายไหล\" | Hypersalivation |\n| \"หยดยากำจัดเห็บของสุนัข บีบทั้งหลอด\" | Topical exposure to canine-labelled permethrin spot-on, full tube, canine product used on a cat |\n| \"หยดเมื่อเช้า สั่นเมื่อบ่าย\" | Onset \\~5 h post-exposure |\n| \"เลียตัวหลังหยด\" | Possible oral ingestion via grooming |\n\n## H. Key take-away และคำถามชวนคิด\n1. ในแมวที่ป่วยเฉียบพลัน สั่น ให้ถามการสัมผัสสารพิษเป็นอันแรก โดยถามจากสิ่งที่ทา หยด ฉีด พ่น ใส่ปลอก และยาชนิดใดที่ไม่คิดว่าเป็นยา\n2. ชื่อยาไม่พอ ต้องถามชนิดสัตว์ที่ป้ายระบุ และขอป้ายหรือรูปที่เห็นได้จริง: บอกสีหรือยี่ห้อไม่พอและ \"สำหรับสุนัข\" เป็นข้อมูลที่หายไปจากประโยคของเจ้าของ\n3. เจ้าของที่ตื่นเต้นต้องให้ความมั่นใจและความชัดเจนแบบสั้น ใช้ Reflection และบอกขั้นตอนถัดไปทีละข้อ และอย่าตำหนิในช่วงเวลาที่เจ้าของกำลังตื่นกลัว\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- ถ้าเจ้าของถามว่า \"ให้กินนมได้ไหม\" คุณจะตอบอย่างไรในสองประโยคที่ชัดและสุภาพ\n- เมื่อเจ้าของชื่อยาไม่ได้ คุณจะถามอย่างไรให้ได้ข้อมูลที่ใช้ได้ในไม่กี่นาที\n- คุณจะทำให้เจ้าของใจเย็นลงได้อย่างไรโดยไม่ทำให้เสียเวลา\n"}, {"file": "09-cat-effusive-fip.md", "md": "---\nid: 09-cat-effusive-fip\ntitle: \"Effusive FIP\"\nspecies: cat\nsystem: \"ติดเชื้อ, ช่องท้อง-อก\"\nlevel: Advanced\nquota: 30\nurgency: high\npersona: \"\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"มะลิ\\\" ลูกแมวไทยผสม เพศเมีย ยังไม่ทำหมัน 6 เดือน 2.4 กก. เลี้ยงในบ้าน\"\nopening: \"น้องท้องใหญ่ขึ้นเรื่อยๆ ค่ะ ตัวเล็กแต่ท้องป่อง แล้วดูหายใจเร็วๆ ด้วย\"\n---\n\n# เคส 9 — ลูกแมวท้องกางและหายใจเร็ว (Effusive FIP)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"มะลิ\" ลูกแมวไทยผสม เพศเมีย ยังไม่ทำหมัน 6 เดือน 2.4 กก. เลี้ยงในบ้าน |\n| เจ้าของ | คุณฝน อายุ 24 เพิ่งรับเลี้ยงแมวตัวแรก กังวลมาก (Anxious) ถามซ้ำว่า \"เป็นอะไรมากไหมคะ\" และมักถามว่าจะรักษาหายไหมก่อนที่นักศึกษาจะถามประวัติครบ |\n| ประโยคเปิด | \"น้องท้องใหญ่ขึ้นเรื่อยๆ ค่ะ ตัวเล็กแต่ท้องป่อง แล้วดูหายใจเร็วๆ ด้วย\" |\n| พูดเองโดยไม่ต้องถาม (V) | ท้องใหญ่ขึ้นภายในประมาณ 1 สัปดาห์ หายใจเร็ว กินน้อยลง |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| ระยะเวลา | T | \"ท้องเริ่มป่องเมื่อประมาณหนึ่งสัปดาห์ก่อนค่ะ ก่อนหน้านั้นซึมนิดๆ กินได้ลดลงมาประมาณสองสัปดาห์\" |\n| การหายใจ | S | \"อ้าปากหายใจตอนวิ่งเล่น แต่ตอนนอนท้องกระเพื่อมเร็วค่ะ ไม่แน่ใจว่าเร็วแค่ไหน\" (ถ้าให้นับ: ตอบว่าจะลองนับ ไม่มีตัวเลข) |\n| ท่านั่ง/นอน | S | \"ช่วงนี้ไม่ค่อยนอนราบ นั่งหลังตรงบ่อยค่ะ\" |\n| ที่มาของแมว | T | \"รับมาจากคนที่เก็บแมวจรมาเลี้ยงเมื่อ 3 สัปดาห์ก่อนค่ะ\" |\n| แมวตัวอื่น / พี่น้อง | S | \"ได้ยินว่าพี่น้องท้องเดียวกันตัวหนึ่งตายไปแล้วค่ะ ท้องบวมเหมือนกัน\" (เล่าเฉพาะเมื่อถามถึงพี่น้องหรือที่มา) |\n| แมวที่บ้านเดิม | T | \"คนเก็บมามีแมวหลายตัวอยู่ด้วยกันค่ะ\" |\n| วัคซีนและถ่ายพยาธิ | T | \"ฉีดวัคซีนเข็มแรกตอนรับมา ถ่ายพยาธิแล้วค่ะ\" |\n| อาการไข้ | S | \"จับตัวแล้วอุ่นๆ ค่ะ ไม่ได้วัดปรอท\" |\n| อาเจียน / ท้องเสีย | T | \"ไม่อาเจียนค่ะ อุจจาระนิ่มๆ ช่วงที่เปลี่ยนที่อยู่ใหม่\" |\n| การกิน | T | \"กินอาหารเปียกได้ครึ่งซอง เมล็ดแห้งแทบไม่กิน\" |\n| ปัสสาวะ | T | \"ปกติค่ะ ทรายแมวไม่ได้เปลี่ยนไป\" |\n| ตา / สีเหงือก | S | \"ตาดูหม่นลงนิดหน่อยตอนอยู่ในที่แสงน้อยค่ะ ไม่แน่ใจ\" |\n| ยาที่ให้เอง | T | \"ไม่ได้ให้ยาอะไรค่ะ\" |\n| สถานการณ์ที่บ้านใหม่ | T | \"อยู่คนเดียวกับแมวค่ะ ไม่มีสัตว์เลี้ยงอื่น\" |\n| คำถามจากเจ้าของ | — | \"แมวตัวเล็กขนาดนี้จะหายไหมคะ\" / \"ติดไปหาตัวอื่นหรือคนไหมคะ\" (ทดสอบการไม่ให้ความมั่นใจเกินจริง) |\n\nสถานะ Guarded: ถ้านักศึกษาพูดตัดสินเรื่องที่มาของแมว (\"ทำไมรับแมวจากที่ไม่ปลอดภัย\") เจ้าของจะรู้สึกผิดและเงียบลง ไม่เล่าเรื่องพี่น้องที่ตาย\n\nหมายเหตุผู้เล่น: เจ้าของถามว่าหายไหมก่อนมีข้อมูลครบ นักศึกษาควรรับรู้ความกังวลก่อนแล้วจึงบอกว่าต้องตรวจเพิ่ม ห้ามรับปากว่าหายหรือไม่หาย\n\n## C. ตรวจร่างกายเบื้องต้น\nBCS 2/9 · T 39.9 °C · HR 200 · RR 60 หายใจแบบท้องมีส่วนช่วย · เยื่อเมือกซีดอมเหลืองเล็กน้อย · ท้องกางพบ fluid wave · เสียงปอดทางด้านล่างของทรวงอกเบาลงทั้งสองข้าง · ไม่พบเสียงฟู่ที่หัวใจ · ต่อมน้ำเหลืองใต้ขากรรไกรโตเล็กน้อย · ม่านตามีลักษณะขุ่นเล็กน้อย\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| CBC | WBC 18.0 ×10³/µL; lymphopenia (0.9); PCV 24% | PCV ต่ำ (anemia of inflammation); lymphopenia เข้าได้กับ FIP |\n| Total protein / Albumin / Globulin | 8.4 / 2.2 / 6.2 g/dL | A:G 0.35 (ต่ำ) |\n| Bilirubin | 1.6 mg/dL | 0–0.4 |\n| ALT / BUN / Cr | 70 / 28 / 1.0 | ขึ้นเล็กน้อย / ปกติ |\n| ของเหลวช่องท้อง | สีฟางเหลือง หนืด; TP 5.8 g/dL; TNCC \\~2,100/µL; Rivalta positive | modified transudate-exudate โปรตีนสูง |\n| Effusion cytology | ส่วนใหญ่ macrophage และ neutrophil ไม่พบแบคทีเรียหรือเซลล์มะเร็ง | ช่วยตัดสิน septic peritonitis และ lymphoma |\n| RT-PCR FCoV จากของเหลว | บวก | ผลบวกสนับสนุน (ผลแปลคู่กับอาการและ lab อื่น) |\n| FeLV / FIV | ลบทั้งคู่ | — |\n| X-ray | มี pleural effusion เล็กน้อยทั้งสองข้าง; ช่องท้อง loss of serosal detail; เงาหัวใจไม่โตชัดเจน | — |\n| Ultrasound | free fluid ในช่องท้อง; ต่อมน้ำเหลืองเมเซนเทอริกโต; ไม่พบ SI mass | — |\n| Echo | โครงสร้างหัวใจปกติ ไม่พบ HCM | ช่วยตัด cardiogenic effusion |\n\n## E. เฉลยลับ\n- โรค: Effusive (wet) feline infectious peritonitis (FIP) จาก feline coronavirus\n- Differential: septic peritonitis, lymphoma, heart disease (HCM) ที่ทำให้เกิด effusion, hypoproteinemia (liver, PLE, PLN), neoplasia อื่น, toxoplasmosis, bacterial pleuritis/pyothorax\n- ตัวลวง: เสียงปอดเบาและท่านั่งหลังตรงทำให้นึกถึงโรคหัวใจก่อนจะมองโรคติดเชื้อ ประวัติพี่น้องตายถ้าไม่ถามจะหายไป และลูกแมวจากแหล่งหลายตัวเป็นเบาะแสความเสี่ยง\n\n## F. เกณฑ์การถาม\n- Must-ask: การหายใจ (พักและตอนนอน ท่านั่ง) · ที่มาของแมวและประวัติแมวตัวอื่น/พี่น้อง · ระยะเวลาท้องกาง · อาการร่วม (ไข้ ซึม กิน) · วัคซีน ถ่ายพยาธิ\n- High-value: ตาและระบบประสาท · อาเจียน ท้องเสีย · ปัสสาวะ · ยาที่ให้เอง · สัตว์อื่นในบ้านปัจจุบัน\n- Critical miss: ไม่ประเมินความลำบากในการหายใจ (dyspnea) และไม่ถามที่มา/แมวตัวอื่น/พี่น้อง\n- Safety: ลูกแมวหายใจลำบากต้องจัดเป็นเร่งด่วนและไม่ปล่อยให้เจ้าของรอสังเกตที่บ้าน นักศึกษาต้องไม่รับปากว่า \"รักษาหายแน่\" หรือ \"ไม่ติดคน\" และไม่ให้ข้อมูลการรักษาเฉพาะเจาะจงนอกเหนือขอบเขตที่อาจารย์กำหนด ต้องบอกอย่างตรงไปตรงมาว่าข้อมูลยังไม่พอจะสรุปและต้องตรวจเพิ่ม\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"ท้องใหญ่ขึ้นเรื่อยๆ\" | Progressive abdominal distension \\~1 week |\n| \"หายใจเร็ว อ้าปากตอนเล่น\" | Tachypnea, open-mouth breathing on exertion (ต้องนับ RR ตอนพัก) |\n| \"ไม่ค่อยนอนราบ นั่งหลังตรง\" | Orthopnea-like posture |\n| \"ซึม กินน้อยลงสองสัปดาห์\" | Lethargy, hyporexia \\~2 weeks |\n| \"พี่น้องท้องเดียวกันตายเพราะท้องบวม\" | Littermate death with abdominal effusion (suspected infectious cause) |\n| \"รับมาจากคนที่เก็บแมวจร\" | Multi-cat source, stressful rehoming (FCoV exposure risk) |\n| \"ตาดูหม่น\" | Possible ocular involvement (aqueous flare / uveitis) |\n| \"จับตัวอุ่นๆ\" | Suspected fever (not measured) |\n\n## H. Key take-away และคำถามชวนคิด\n1. อย่าให้ข้อมูลที่จะทำให้คิดโรคหัวใจมาบังโรคติดเชื้อ: ถามที่มาและประวัติครอกก่อนด่วนสรุป เพราะประวัติพี่น้องและแหล่งที่มาไม่ปรากฏใน lab\n2. การหายใจลำบากคือสัญญาณเร่งด่วนที่ต้องถามเป็นอันดับแรกๆ โดยไม่ต้องรอให้เจ้าของพูดถึงเอง\n3. เจ้าของกังวลขอความมั่นใจ: ใช้ Reflection และ Affirmation แล้วบอกตามจริงว่า \"ตอนนี้ยังไม่ทราบ\" และจะตรวจอะไรต่อ แทนการปลอบเกินจริง (Understand before judging, Collaborate rather than persuade)\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- คุณจะถามเรื่องที่มาของลูกแมวอย่างไรโดยไม่ให้เจ้าของรู้สึกว่าโดนตำหนิ\n- ถ้าเจ้าของถามว่า \"จะหายไหม\" ตอนที่ยังไม่มีผลตรวจ คุณจะตอบอย่างไรโดยไม่รับปากและไม่ทำให้เสียกำลังใจ\n- ข้อมูลอะไรจากประวัติที่แยก FIP ออกจากโรคหัวใจได้ก่อนเห็นผล echo\n"}, {"file": "10-cat-dm-dka.md", "md": "---\nid: 10-cat-dm-dka\ntitle: \"Diabetes mellitus with DKA\"\nspecies: cat\nsystem: \"ต่อมไร้ท่อ\"\nlevel: Advanced\nquota: 30\nurgency: high\npersona: \"\"\nsource: authored\nstatus: draft\nversion: 1\npatient: \"\\\"ซิมบ้า\\\" แมวบ้านขนสั้น เพศผู้ทำหมัน 10 ปี 7.1 กก. (ก่อนหน้านี้ 8.4 กก.) เลี้ยงในบ้าน\"\nopening: \"ซิมบ้าอ่อนแอมาสองวันแล้วค่ะ ไม่กินข้าว อ้วกด้วย แต่ก่อนหน้านี้กินน้ำเยอะมากค่ะ\"\n---\n\n# เคส 10 — แมวอ้วนกินน้ำเยอะ แต่ผอมลง และอ่อนแรงเฉพาะ 2 วันนี้ (Diabetes mellitus with DKA)\n\n## A. ผู้ป่วยและเจ้าของ\n| หัวข้อ | รายละเอียด |\n| --- | --- |\n| ผู้ป่วย | \"ซิมบ้า\" แมวบ้านขนสั้น เพศผู้ทำหมัน 10 ปี 7.1 กก. (ก่อนหน้านี้ 8.4 กก.) เลี้ยงในบ้าน |\n| เจ้าของ | คุณเอ็ม อายุ 45 ใจดี แต่จำลำดับเวลาไม่ได้ (Incomplete Recall) มักผสมอาการเรื้อรังและอาการเฉียบพลันเข้าด้วยกัน |\n| ประโยคเปิด | \"ซิมบ้าอ่อนแอมาสองวันแล้วค่ะ ไม่กินข้าว อ้วกด้วย แต่ก่อนหน้านี้กินน้ำเยอะมากค่ะ\" |\n| พูดเองโดยไม่ต้องถาม (V) | อ่อนแรง ไม่กิน อ้วก (และพูดถึงกินน้ำเยอะก่อนหน้านี้แบบผ่านๆ) |\n\n## B. ข้อมูลที่เจ้าของรู้\n| หมวดที่ต้องถาม | ป้าย | เจ้าของตอบ |\n| --- | --- | --- |\n| ระยะเวลาช่วงแรก (เรื้อรัง) | T | \"กินน้ำเยอะมากค่ะ ระยะสามสี่เดือนแล้ว กินข้าวก็เยอะ แต่น้ำหนักลง\" |\n| น้ำและฉี่ | S | \"ชามน้ำหมดทุกวัน บางวันเติมสามครั้ง ก้อนทรายใหญ่เท่ากำปั้นสองสามก้อนทุกวัน\" |\n| น้ำหนัก | S | \"ผอมลง จากแต่ก่อนอ้วนมาก ตอนนี้เห็นกระดูกสันหลังชัดขึ้น\" |\n| ท่าเดิน | S | \"เดินเหมือนเอาส้นเท้ากดพื้น กระโจกขาหลังให้เห็นแล้ว เป็นมาสามสี่เดือน ยืนไม่ค่อยสูง\" |\n| ยาที่เคยได้รับ | S | \"เมื่อสี่เดือนก่อนพาไปคลินิก คันมาก หมอฉีดยาให้เข็มหนึ่ง แล้วคันก็หาย\" (ไม่รู้ชื่อยา ต้องถามว่าเป็นยาเข็มในคลินิกหรือยากิน และทางคลินิกจะระบุได้ว่าเป็น corticosteroid) |\n| อาการสองวันนี้ | S | \"สองวันนี้ไม่กินเลยค่ะ นอนซุก อ้วก 3 ครั้ง หายใจลึกๆ เร็วๆ ปากมีกลิ่นหวานแปลกๆ\" |\n| อาเจียน | T | \"อ้วกเป็นน้ำเหลืองๆ ขาวๆ สามครั้งในสองวัน\" |\n| ปัสสาวะสองวันนี้ | U | \"ไม่แน่ใจค่ะ ไม่เห็นไอบอยู่ในกระบะ คงไม่ได้ไปบ่อยแล้ว\" (แยกจากช่วงแรกที่ฉี่เยอะ) |\n| อุจจาระ | T | \"สองวันนี้ไม่ค่อยเห็น\" |\n| พฤติกรรมการกิน | T | \"กินอาหารเม็ดและขนมแมวเลียประจำ\" (อาหารเม็ดคาร์โบไฮเดรตสูง ถ้าถามชนิด) |\n| โรคเดิม / ปัญหาผิวหนังก่อนหน้า | T | \"คันมากที่ตัวและหน้าอกค่ะ แล้วก็ไม่เคยป่วยอะไรอีก\" |\n| ประวัติพยาธิ / สัตว์อื่น | T | \"ไม่มีค่ะ อยู่กับแมวอีกตัว ตัวนั้นปกติ\" |\n| ผลเลือดเดิม | U | \"ไม่เคยตรวจค่ะ\" |\n\nสถานะ Guarded: ถ้านักศึกษาตำหนิว่าปล่อยให้อ้วนหรือพาไปหมอช้า เจ้าของจะตอบสั้นและไม่เล่าเรื่องยาเข็มที่คลินิก\n\nหมายเหตุผู้เล่น: เจ้าของผสมช่วงเรื้อรังกับช่วงเฉียบพลันได้ง่าย คำถามที่ช่วยคือ \"อาการแรกสุดคืออะไร เมื่อไร\" และ \"สองวันนี้ต่างจากก่อนหน้านั้นยังไง\"\n\n## C. ตรวจร่างกายเบื้องต้น\nBCS 3/9 · T 37.4 °C · HR 190 · RR 44 หายใจลึกและเร็ว · เยื่อเมือกซีดอมเหลือง (icterus เล็กน้อย) · ขาดน้ำประมาณ 8% · อ่อนแรง นอนตะแคง · plantigrade stance ขาหลังทั้งสอง · ขนหยาบเป็นประกายความสกปรก · กลิ่นลมหายใจหวานแปลกๆ (ketone odor) · ตับโตเล็กน้อย ท้องส่วนบนเจ็บเล็กน้อย\n\n## D. Lab และภาพวินิจฉัย\n| รายการ | ผล | ค่าอ้างอิงตัวอย่าง / หมายเหตุ |\n| --- | --- | --- |\n| Glucose | 548 mg/dL | 70–150 |\n| Fructosamine | 612 µmol/L | \u003c350 (บ่งชี้ภาวะน้ำตาลสูงเรื้อรัง แยกจาก stress hyperglycemia) |\n| β-hydroxybutyrate | 4.8 mmol/L | \u003c0.5 |\n| Venous blood gas | pH 7.18 ; HCO₃⁻ 10 mmol/L | metabolic acidosis |\n| K / Na | 3.2 / 142 | K ต่ำ (จะต่ำลงอีกเมื่อให้อินซูลิน) |\n| ALT / ALP / Bilirubin | 150 / 120 / 1.4 | ประกอบด้วย hepatic lipidosis และอาจมี pancreatitis/หน้าที่ท่อนทางเดินน้ำดีป่วยร่วม |\n| BUN / Cr | 42 / 1.7 | prerenal azotemia จากขาดน้ำ |\n| fPLI | สูง | สนับสนุน pancreatitis ร่วม แต่ไม่ใช่ผลยืนยันเดี่ยว |\n| Total T4 | 2.4 µg/dL | ปกติ ช่วยตัด hyperthyroid |\n| Urinalysis | glucosuria 4+ ; ketonuria 3+ ; USG 1.032 ; ไม่พบหลักฐานการติดเชื้อ | — |\n| X-ray / US | ตับโตเล็กน้อย hyperechoic ; บริเวณตับอ่อน hypoechoic บริเวณสงสัยพานกรียส ; ผนังท่อนทางเดินน้ำดีปกติ | สอดคล้องกับ hepatic lipidosis และ pancreatitis ระดับเบา |\n\n## E. เฉลยลับ\n- โรค: Diabetes mellitus (ระยะเรื้อรัง เกิดหลังให้ corticosteroid เป็นปัจจัยส่ง) ร่วมกับ diabetic ketoacidosis (ช่วงเฉียบพลัน 2 วัน) และมีโรคร่วม (hepatic lipidosis, pancreatitis ระดับเบา)\n- Differential: stress hyperglycemia, acromegaly (insulin-resistant DM), hyperadrenocorticism, pancreatitis เป็นสาเหตุหลัก, CKD, hyperthyroidism, neoplasia\n- ตัวลวง: ช่วงเรื้อรังกินน้ำเยอะ กินข้าวเยอะ แต่ผอมลง ถูกผสมกับอาการเฉียบพลัน อาจทำให้สรุปทันทีว่าเป็น DKA จากอาการอย่างเดียว ซึ่งทำไม่ได้ ต้องใช้ผลตรวจยืนยัน\n\n## F. เกณฑ์การถาม\n- Must-ask: ไทม์ไลน์แยกช่วงเรื้อรังกับช่วงเฉียบพลัน · ปริมาณน้ำและฉี่ · น้ำหนักและความอยากอาหาร · อาเจียนและการกิน · ยาที่เคยได้รับ โดยเฉพาะยาฉีดในคลินิก\n- High-value: ท่าเดิน (ปลายประสาทส่วนปลาย) · กลิ่นลมหายใจ · อาหารที่กิน · รายละเอียดอาการผิวหนังเมื่อสี่เดือนก่อน · การปัสสาวะและอุจจาระใน 2 วันนี้\n- Critical miss: ไม่แยกช่วงเรื้อรังที่กินน้ำเยอะออกจากช่วงเฉียบพลันที่ไม่กินและอ่อนแรง 2 วัน (ทำให้ประเมินความเร่งด่วนผิด)\n- Safety: แมวอ่อนแรงและหายใจลึกเร็วไม่ควรถูกแนะนำให้รอดูอาการที่บ้าน และห้ามแนะนำให้เจ้าของปรับเปลี่ยนยาหรือป้อนข้าวเอง นักศึกษาต้องไม่บอกว่าเป็น DKA หรือบอกเจ้าของว่าเป็นเพราะยาเข็ม ก่อนได้ผลตรวจยืนยัน\n\n## G. ภาษาชาวบ้าน → ศัพท์คลินิก\n| เจ้าของพูดว่า | บันทึกเป็น |\n| --- | --- |\n| \"กินน้ำเยอะ ชามน้ำหมดทุกวัน ก้อนทรายใหญ่\" | Polydipsia and polyuria, chronic phase \\~4 months |\n| \"กินข้าวเยอะแต่ผอมลง\" | Polyphagia with weight loss (8.4 → 7.1 กก. ประมาณ 15%) |\n| \"เดินเหมือนเอาส้นเท้ากดพื้น\" | Plantigrade posture (diabetic neuropathy) |\n| \"หมอฉีดยาให้เข็มหนึ่งแก้คัน\" | Probable injectable corticosteroid \\~4 months ago (needs confirmation from records) |\n| \"2 วันนี้ไม่กิน อ่อนแรง อ้วก\" | Acute anorexia, lethargy, vomiting × 2 days (acute decompensation) |\n| \"ปากมีกลิ่นหวานแปลกๆ\" | Ketone odor |\n| \"หายใจลึกๆ เร็วๆ\" | Kussmaul-type respiration / tachypnea |\n\n## H. Key take-away และคำถามชวนคิด\n1. แยกไทม์ไลน์: เรื้อรัง (4 เดือน) กับเฉียบพลัน (2 วัน) คือคนละช่วงของเรื่อง และทั้งสองช่วงต้องมีหลักฐานแยกกัน\n2. ยาที่เจ้าของจำชื่อไม่ได้ไม่ใช่เรื่องจบ: ถามว่าฉีดหรือกิน ที่ไหน กี่ครั้ง และขอสมุดประวัติ จากคลินิกเดิมแทนการเดา\n3. อาการเร่งด่วนไม่ได้แปลว่าต้องข้ามการถาม: ทำ triage แบบสั้น (หายใจ อ่อนแรง ซึม อาเจียน) แล้วค่อยถามประวัติย้อนหลัง และอย่าสรุปว่าเป็น DKA จากอาการได้แค่อย่างเดียว\n\nคำถามให้นักศึกษาตอบก่อนเฉลย:\n\n- คุณจะใช้คำถามอย่างไรให้เจ้าของแยก \"อาการแรก\" ออกจาก \"อาการตอนนี้\"\n- เจ้าของบอกว่า \"ฉีดยาเข็มหนึ่ง\" คุณจะระบุชนิดยาได้อย่างไรโดยไม่เดา\n- อาการไหนที่ทำให้เราไม่ควรสรุปว่าเป็น DKA ก่อนได้ผล lab\n"}], "rules": {"debrief": "# Debrief และคลัง Key take-away\n\nจุดประสงค์คือให้นักศึกษาเห็นว่าตัวเองพลาดตรงไหน และโรคจริงเป็นอะไร โดยทำให้คิดตามหลักการที่นำไปใช้กับเคสอื่นได้ ไม่ใช่แค่บอกคะแนน\n\n**โครงรายงาน Debrief (ส่งครบทุกรอบ ลำดับตามนี้)**\n\n| ลำดับ | ส่วน | เนื้อหา |\n| --- | --- | --- |\n| 1 | คะแนนรวมและระดับผล | คะแนน 8 ด้าน ระดับผล และสถานะ Safety Gate (ผ่าน/ถูกจำกัด) |\n| 2 | เฉลยและไทม์ไลน์จริง | เปิดเฉลยหลังนักศึกษาส่งฟอร์มแล้วเท่านั้น โรค ไทม์ไลน์ และตัวลวงที่มีในเคส |\n| 3 | ตารางรายคำถาม | แต่ละ turn: คำถาม → ประเภท (เปิด/ปิด/นำ/ซ้ำ/นอกเรื่อง) → ได้ข้อมูลอะไร → ความคิดเห็นสั้น ๆ |\n| 4 | ข้อมูลที่พลาด | รายการที่ไม่ได้ถาม พร้อมประโยคตัวอย่างที่ถามเจ้าของเข้าใจง่าย เช่น \"ช่วงนี้เบลล่าเจอเห็บบ้างไหมคะ หรือเคยหยดยากำจัดเห็บไหม\" |\n| 5 | คำที่แปลผิด/แบบฟอร์มที่ไม่ตรง | ผลเทียบตาราง lay → clinical ของเคส |\n| 6 | เจ้าของรู้สึกอย่างไร (เสียง AI Owner ออกจากบท) | บอกจากมุมมองเจ้าของ 2–3 ประโยคว่าคำถามไหนทำให้พูดให้ง่ายหรือยากขึ้น โดยไม่เปิดเผยข้อมูลลับที่ยังไม่ถูกถาม |\n| 7 | Key take-away 3 ข้อต่อเคส | ด้านคลินิก 1 ข้อ ด้านการสื่อสาร 1 ข้อ ด้านอคติในการคิด 1 ข้อ (ดึงจากหัวข้อ H ของเคส) |\n| 8 | คำถามชวนคิด (Socratic) | 3 คำถามที่ให้นักศึกษาตอบก่อนอ่านคำเฉลย ดึงจาก H ของเคส และอย่างน้อย 1 คำถามที่ถามความรู้สึกของเจ้าของ |\n| 9 | ใบสั่งฝึก (learning prescription) | 1–2 ทักษะที่ควรฝึกต่อ และเคสที่แนะนำให้ลองต่อ |\n\nกฎการเขียนคำวิจารณ์: ชี้คำถามที่หยิบยกมาจริงแล้วบอกผลที่เกิดกับผู้ป่วยและเจ้าของ แทนที่จะตัดสินทักษะทั้งคน ให้ประโยคที่นักศึกษาควรลองใช้แทนคำที่พลาด และไม่เปิดเผยเฉลยก่อนนักศึกษาได้คิดเอง\n\n**คลังหลักการ P1–P15 (ใช้เลือกแบบหมุนใน Debrief อย่างเหมาะสมกับผลในรอบนั้น)**\n\n| รหัส | หลักการ | ใช้กับเคส |\n| --- | --- | --- |\n| P1 | ถามแบบฟันเนล: เปิด → เจาะ → ปิด ไม่เริ่มด้วยคำถามปิด | ทุกเคส |\n| P2 | ป้ายของเจ้าของไม่ใช่ข้อมูล (\"ซึม\" \"แก่แล้ว\" \"ท้องเสีย\") ต้องถามต่อให้ได้พฤติกรรมที่เห็นจริง | 1, 5, 7 |\n| P3 | แปลคำคลุมเครือเป็นตัวเลขผ่านตัวเทียบที่เจ้าของเห็นได้ | 3, 4, 5, 7, 10 |\n| P4 | แยกไทม์ไลน์เรื้อรังกับเฉียบพลัน | 5, 10 |\n| P5 | ทำ exposure sweep: พิษ ยา เห็บ ของกินไม่เหมาะ การเดินทาง สัตว์อื่น | 2, 6, 8, 9 |\n| P6 | อย่าติดกับ chief complaint ทำการทบทวนระบบให้ครบ | 4, 5, 10 |\n| P7 | หา red flag และจัดความเร่งด่วนก่อนเก็บรายละเอียด | 3, 7, 8, 9, 10 |\n| P8 | ยอมบอกว่ายังไม่ทราบและอย่าปลอบเกินจริง | 5, 9 |\n| P9 | ถามยาและสิ่งที่เจ้าของให้เองให้ครบ (ยาคน ยาหยด อาหารเสริม) เพราะเจ้าของมักไม่นับว่าเป็นยา | 6, 7, 8, 10 |\n| P10 | Understand before judging: ใช้หลักภูเขาน้ำแข็งของ Satir มองความรู้สึกและความกลัวใต้พฤติกรรม | 4, 6, 8 |\n| P11 | Listen before advising: Ask–Provide–Ask ถามก่อนว่าเขารู้อะไร บอก แล้วถามว่าเข้าใจอย่างไร | 7, 8, 9 |\n| P12 | สังเกต righting reflex (อยากสั่งแก้ทันที) และใช้ OARS (คำถามเปิด ชื่นชม สะท้อน สรุป) | 4, 6 |\n| P13 | มองอุปสรรคด้วย COM-B (ความสามารถ โอกาส แรงจูงใจ) แทนการประกาศว่าเจ้าของ \"ไม่ใส่ใจ\" | 1, 4, 6 |\n| P14 | Teach-back: ให้เจ้าของพูดทวนว่าจะทำอะไรต่อ เพื่อตรวจว่าสื่อสารได้ตรง | 7, 8 |\n| P15 | Collaborate rather than persuade: ไม่ตำหนิ ไม่โน้มน้าว หาทางเลือกที่ทำได้จริงร่วมกัน | 1, 4, 6, 9 |\n\n**คำถามชวนคิดระดับรอบ (เลือกใช้หลังตารางคำถาม)**\n\n- คำถามไหนในรอบนี้ที่ทำให้เจ้าของเล่าข้อมูลใหม่ที่ไม่ได้คาดไว้ และคำถามไหนที่ทำให้เขาปิดตัว\n- ถ้าคุณได้เวลาเพิ่มอีก 3 คำถาม คุณจะใช้ไปกับเรื่องใด\n- จุดที่คุณคิดว่าได้คำตอบเร็วเกินไปคือจุดไหน และคำตอบนั้นมีหลักฐานอะไร\n- คุณได้บันทึกอย่างไรไม่ให้เชื่อสิ่งที่เจ้าของพูดมากกว่าที่พูดจริง\n", "form": "# แบบฟอร์มบันทึกเวชระเบียน\n\nหลังจบสัมภาษณ์ นักศึกษาต้องกรอกฟอร์มนี้ก่อนได้คะแนน เพราะการบันทึกคือหลักฐานว่านักศึกษาแปลคำพูดของเจ้าของเป็นข้อมูลทางคลินิกได้จริง ไม่ใช่แค่ถามครบ\n\n| หัวข้อในฟอร์ม | สิ่งที่ต้องกรอก | หลักการตรวจให้คะแนน |\n| --- | --- | --- |\n| 1. ข้อมูลผู้ป่วย (signalment) | ชื่อ ชนิด สายพันธุ์ เพศ สถานะทำหมัน อายุ น้ำหนัก การเลี้ยง | ครบและตรงกับที่เจ้าของบอก ไม่ใส่ค่าที่ไม่ได้ถาม |\n| 2. Chief complaint | อาการหลักที่พามา สั้น 1 บรรทัด ใช้ศัพท์คลินิก พร้อมระยะเวลา | แปลงคำชาวบ้านถูก ไม่ใช้คำวินิจฉัยแทนอาการ |\n| 3. History of present illness | ไทม์ไลน์เรียงตามเวลา ระบุช่วงเรื้อรังกับช่วงเฉียบพลันแยกกัน ใส่ตัวเลขที่ได้จากการถามเทียบปริมาณ | คะแนนสูงเมื่อไทม์ไลน์ชัดและมีตัวเลข/การเปรียบเทียบ |\n| 4. Pertinent history | ยา (รวมยาคนและยาหยดกำจัดเห็บ) · วัคซีน/ถ่ายพยาธิ · อาหาร · สิ่งแวดล้อม/การสัมผัส · โรคเดิม · สัตว์อื่นในบ้าน · การเดินทาง · การผสมพันธุ์ (เฉพาะสุนัข/แมวเพศเมีย) | เฉพาะสิ่งที่เกี่ยวข้องกับปัญหา ไม่คัดลอกรายการมากทั้งหมด |\n| 5. ข้อมูลที่ไม่แน่ใจ/ยังขาด | ระบุว่าอะไรยังไม่ทราบ อะไรต้องยืนยันกับเจ้าของหรือเวชระเบียนเดิม | ให้คะแนนการสะท้อนความไม่แน่นอนอย่างซื่อสัตย์ หักคะแนนเมื่อเดาเป็นข้อเท็จ |\n| 6. Problem list | รายการปัญหาทางคลินิกแยกเป็นข้อ เรียงตามความสำคัญ | แยกปัญหาที่พามา (presenting) ออกจากปัญหาที่พบจากการถาม |\n| 7. Differential diagnosis | อย่างน้อย 3 รายการ แต่ละรายการระบุข้อมูลสนับสนุน ข้อมูลคัดค้าน และการตรวจที่จะช่วยแยก | คะแนนจากเหตุผลรองรับ ไม่ใช่คะแนนจากตรงกับเฉลยอย่างเดียว |\n| 8. Initial assessment และความเร่งด่วน | อย่างไรผู้ป่วยควรถูกจัดเร่งด่วนหรือไม่ และเหตุผล | ตรงกับความเร่งด่วนของเคส เชื่อมกับ Safety Gate (หัวข้อถัดไป) |\n| 9. แผนตรวจเพิ่มเบื้องต้น | ตรวจอะไรบ้างและทำไม เรียงตามลำดับความจำเป็น | คะแนนเป็น optional ในระดับ Beginner และให้น้ำหนักมากขึ้นในระดับ Advanced |\n\nการประกันความถูกต้องของการบันทึก (ทำงานโดย AI Examiner อย่างเดียว):\n\n- ทุกข้อในฟอร์มต้องอ้างอิงได้กับ turn ที่นักศึกษาถามจริง ข้อมูลที่ไม่มีในบทสนทนาถือว่าเดาหรือสร้างขึ้น (fabricated) และหักคะแนน\n- คำพูดของเจ้าของที่แปลผิดความหมาย (เช่น บันทึกว่า \"หอบ\" แต่เจ้าของบอกแค่ \"ท้องขึ้นลงเร็ว\") หักคะแนนและชี้ใน Debrief\n- ตัวเลขที่นักศึกษาใส่เองจากการคำนวณ (เช่น น้ำหนักลด %) ต้องคำนวณถูกจากค่าที่ได้จริง\n- ไม่ให้คะแนนการเขียนยาวหรือศัพท์สวย ให้คะแนนที่ความถูกต้อง ครบ และตรงกับหลักฐาน\n", "owner": "# กติกา AI เจ้าของสัตว์\n\nAI เจ้าของรู้เฉพาะสิ่งที่เจ้าของจริงๆ จะรู้ พูดภาษาชาวบ้าน ไม่เปิดเผยโรค และเปิดเผยข้อมูลมากหรือน้อยตามคุณภาพคำถามและความรู้สึกที่ได้รับจากนักศึกษา ข้อเท็จจริงของเคสไม่เปลี่ยนไม่ว่าจะเจอเจ้าของบุคลิกไหน\n\n**ข้อมูลในเคสแบ่งเป็น 4 ชั้น (ตาม Blueprint)**\n\n| ชั้น | ความหมาย | AI ทำอย่างไร |\n| --- | --- | --- |\n| OWNER-KNOWN | เจ้าของรู้และเล่าได้ | ตอบตามระดับการเปิดเผยด้านล่าง |\n| EXAM / TEST-AVAILABLE | การตรวจร่างกาย ผลเลือด ภาพถ่ายรังสี อัลตราซาวด์ | แสดงเฉพาะในขั้น \"ขอตรวจเพิ่ม\" เมื่อนักศึกษาขอเอง |\n| CLINICAL-UNKNOWN | ไม่มีข้อมูลในเคส | ตอบว่า \"ไม่ทราบ / ไม่ได้สังเกตค่ะ\" ห้ามแต่งเพิ่ม |\n| EXPERT-ONLY | ชื่อโรค เฉลย differential | ห้ามเปิดเผยจนจบเคส |\n\n**ระดับการเปิดเผยข้อมูลของเจ้าของ (ติดป้ายทุก fact ในเคส)**\n\n| ป้าย | เปิดเมื่อ | ตัวอย่าง |\n| --- | --- | --- |\n| V (Volunteered) | พูดเองในประโยคเปิด | \"อ้วกมา 4-5 รอบแล้วค่ะ\" |\n| T (Topic) | นักศึกษาถามถึงหมวดนั้น ไม่ต้องเจาะจง | ถามเรื่องอุจจาระ → \"เหลว สีแดงคล้ำ กลิ่นคาวมากค่ะ\" |\n| S (Specific) | ต้องถามเจาะจงหรือถามใกล้เคียงมาก | ถาม \"มีของเล่นหรือของใช้หายไปไหม\" → \"อ๋อ ตุ๊กตายางหายไปสองวันแล้วค่ะ\" |\n| U (Unknown) | เจ้าของไม่รู้จริง | \"ไม่ได้นับค่ะ ไม่แน่ใจ\" |\n\n**กลไกที่ทำให้การสื่อสารที่ดีได้ข้อมูลมากขึ้น**\n\n- คำถามปลายเปิดที่ตามด้วยการฟัง ได้คำตอบเป็นเรื่องเล่า และแถมข้อมูลระดับ T เพิ่ม 1 ชิ้นที่คำถามปิดจะไม่ได้ คำถามปิดได้คำตอบสั้น ใช่ / ไม่ใช่\n- เจ้าของมี \"สถานะความไว้ใจ\" ภายใน 3 แบบ: Open, Neutral, Guarded เริ่มที่ Neutral ถ้านักศึกษาสะท้อนความรู้สึก ชื่นชม หรือแสดงความเห็นใจ จะขยับไป Open และเจ้าของยอมเล่าข้อมูลระดับ S ง่ายขึ้น ถ้านักศึกษาตำหนิหรือตัดสิน (\"ทำไมไม่พามาเร็วกว่านี้\") จะขยับไป Guarded เจ้าของตอบสั้นลงและไม่เล่าเรื่องที่รู้สึกผิด สถานะนี้เปลี่ยนเกณฑ์การเปิดเผยเท่านั้น ไม่เปลี่ยนข้อเท็จจริง\n- ถ้านักศึกษาใช้ศัพท์แพทย์ที่เจ้าของไม่รู้ เจ้าของถามกลับ \"คืออะไรคะ\" โดยไม่นับเป็น turn\n- เจ้าของไม่ตอบ \"ใช่\" ตามน้ำเมื่อคำถามชี้นำไม่ตรงความจริง ตอบเท่าที่จริงเสมอ\n- ถ้าถูกถามซ้ำ ตอบเหมือนเดิม\n- เจ้าของไม่แนะนำการรักษาเอง แต่บางเคสเจ้าของถามคำถามที่เป็นกับดักความปลอดภัย (เช่น \"ให้กินนมได้ไหมคะ\" \"ทำให้อ้วกดีไหม\") เพื่อดูว่านักศึกษาตอบปลอดภัยหรือไม่\n\n**บุคลิกเจ้าของ 4 แบบ (สลับได้กับทุกเคส)**\n\n| บุคลิก | พฤติกรรม | ประโยคตัวอย่าง |\n| --- | --- | --- |\n| Cooperative | ตอบตรงประเด็น ให้ความร่วมมือ | \"เริ่มเมื่อเช้าวานค่ะ อ้วก 4 ครั้ง\" |\n| Anxious | กังวล พูดซ้ำ ถามกลับว่า \"เป็นอะไรมากไหมคะ\" ต้องการความมั่นใจ | \"หมอคะ น้องจะเป็นอะไรไหม ช่วยน้องด้วยนะคะ\" |\n| Low Medical Literacy | ใช้ภาษาชาวบ้าน ไม่รู้ศัพท์ ตีความอาการเองผิดๆ ได้ | \"น่าจะท้องผูกค่ะ เห็นนั่งเบ่ง\" |\n| Incomplete Recall | จำเวลา จำนวน รายละเอียดไม่ได้ ต้องช่วยด้วยจุดอ้างอิง | \"สักสองสามเดือนมั้งคะ จำไม่ได้แน่\" |\n\nนักศึกษาที่ช่วยเจ้าของจำด้วยจุดอ้างอิง (เช่น \"หลังฉีดวัคซีนครั้งล่าสุดหรือเปล่า\") จะได้ข้อมูลที่แม่นกว่านักศึกษาที่ถามซ้ำๆ ว่า \"เมื่อไรคะ\"\n", "rubric": "# เกณฑ์คะแนน 100 คะแนน (8 ด้าน)\n\nทุกคะแนนต้องมีหลักฐานอ้างจากบทสนทนา (เลข turn) หรือจากฟอร์มบันทึก AI อาจารย์ไม่ได้คะแนนจากความรู้สึกหรือจากคำเฉลยของเคสโดยตรง\n\n| ด้าน | คะแนน | วัดอะไร | หลักฐานที่ต้องมี |\n| --- | --- | --- | --- |\n| 1. การเปิดการสนทนาและเก็บข้อมูลผู้ป่วย | 10 | แนะนำตัว เปิดด้วยคำถามปลายเปิด ให้เจ้าของเล่าเองก่อน ได้ signalment ครบ (อายุ เพศ สถานะทำหมัน น้ำหนัก) | turn แรก ๆ และคำถามที่ได้ signalment |\n| 2. คุณภาพของ HPI (ไทม์ไลน์ ปริมาณ ลักษณะ) | 20 | ถามให้ได้เวลาเริ่ม การดำเนินของโรค แยกช่วงเรื้อรัง/เฉียบพลัน แปลคำคลุมเครือเป็นตัวเลข (เทียบปริมาณ) ถามข้อมูลที่ทำให้อาการดีขึ้น/แย่ลง | turn ที่ถามเรื่องเวลา ปริมาณ ลักษณะ และคำตอบที่ได้ |\n| 3. การทบทวนระบบและประวัติที่เกี่ยวข้อง | 20 | วนถามระบบที่เกี่ยว (กิน น้ำ ปัสสาวะ อุจจาระ หายใจ ผิวหนัง ระบบสืบพันธุ์) ยา วัคซีน การป้องกันพยาธิ หมัด และเห็บ อาหาร สิ่งแวดล้อม โอกาสสัมผัสพิษ โรคเดิม สัตว์อื่นในบ้าน | จำนวนหมวดที่ครอบคลุมเทียบกับหมวด Must-ask และ High-value ของเคส |\n| 4. Red flag และการคัดกรองความเร่งด่วน | 10 | ถามอาการอันตรายก่อน (หายใจ เลือดออก ชัก เป็นลม ปัสสาวะไม่ออก สัมผัสพิษ) และจัดลำดับความเร่งด่วนได้เหมาะสม | ตรงกับ Critical miss ของแต่ละเคสและช่อง Initial assessment ในฟอร์ม |\n| 5. เทคนิคการถาม | 10 | ถามแบบฟันเนล (เปิด → เจาะ → ปิด) ถามทีละประเด็น ไม่ถามนำ ไม่ใช้ศัพท์แพทย์โดยไม่อธิบาย ไม่ถามซ้ำเปล่า ใช้ turn คุ้มค่า | ยกคำถามจริงในแต่ละข้อที่หักหรือให้คะแนน |\n| 6. การสื่อสารและความเห็นอกเห็นใจ | 10 | สะท้อนความรู้สึก ชื่นชมสิ่งที่เจ้าของทำ ไม่ตำหนิ ใช้ภาษาง่าย สรุปและตรวจความเข้าใจ (teach-back) อย่างน้อยหนึ่งครั้งในเคสที่เหมาะ | ยกประโยคของนักศึกษา และปฏิกิริยาของเจ้าของ (สถานะ Open/Neutral/Guarded) |\n| 7. ความถูกต้องของการบันทึก (lay → clinical) | 10 | แปลคำชาวบ้านเป็นศัพท์คลินิกได้ถูก ไม่เติมข้อมูลที่ไม่ได้ถาม แยกข้อมูลที่เจ้าของพูดจริงจากข้อสรุปของนักศึกษา | เทียบฟอร์มกับตาราง G ของเคส |\n| 8. การคิดเชิงเหตุผลและแผนต่อ | 10 | problem list และ differential สอดคล้องกับข้อมูลที่ได้ ไม่ผูกติดกับ chief complaint ระบุความไม่แน่นอน และแผนตรวจเพิ่มเบื้องต้นที่เหมาะสม | ช่อง Differential และ Initial assessment ในฟอร์ม |\n\n**ระดับผลของแต่ละด้าน**\n\n| ระดับ | ความหมาย | สัดส่วนคะแนนของด้าน |\n| --- | --- | --- |\n| ยอดเยี่ยม | ครบ แม่น และเหมาะกับจังหวะของเคส | 90–100% |\n| ดี | ครบในส่วนสำคัญ ขาดบางข้อที่ไม่กระทบการวินิจฉัย | 70–89% |\n| พอใช้ | ได้แก่น แต่ขาดข้อมูลสำคัญหรือขาดหลักฐานอย่างชัดเจน | 40–69% |\n| ต้องพัฒนา | บทสนทนาไม่พอให้ประเมินได้ หรือมีจุดผิดซ้ำ ๆ | ต่ำกว่า 40% |\n\n**กฎพิเศษ**\n\n- คำถามที่ได้ใจความเท่ากันแม้ใช้คำต่างกัน ถือว่าถามแล้ว (equivalent paraphrase ไม่ใช่ miss)\n- ไม่หักคะแนนจากสำเนียง สำเนียงและการออกเสียงระหว่างใช้เสียงพูด หากอาจารย์เปิดให้ใช้เสียง ไม่ตัดคะแนนจากสำเนียงหรือการออกเสียง\n- ข้อความที่ไม่ใช่คำถาม (ทักทาย ปลอบใจ สะท้อนความรู้สึก สรุปทวน) ไม่นับในโควตาตามกติกาการนับ turn และไม่ถูกหักคะแนน กลับกันให้คะแนนในด้าน 6 เมื่อใช้เหมาะจังหวะ\n- อย่าใช้คะแนนไปสรุปว่านักศึกษาเก่งห const textOf = c => typeof c === 'string' ? c : c.filter(p => p.type === 'text').map(p => p.text).join('\n');

async function post(url, headers, body) {
  let r;
  try {
    r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', ...headers }, body: JSON.stringify(body) });
  } catch (e) {
    throw new LLMError('เชื่อมต่อไม่ได้ (เครือข่ายหรือ CORS) ลองใช้โหมดเซิร์ฟเวอร์ Vercel', 0, String(e));
  }
  const raw = await r.text();
  let j = null; try { j = JSON.parse(raw); } catch (_) {}
  if (!r.ok) {
    const msg = j?.error?.message || j?.error?.type || j?.message || raw.slice(0, 300);
    throw new LLMError(`${r.status}: ${msg}`, r.status, j || raw);
  }
  return j;
}

function toOpenAI(cfg) {
  const msgs = [];
  if (cfg.system) msgs.push({ role: 'system', content: cfg.system });
  for (const m of cfg.messages) {
    const p = parts(m.content);
    if (p.every(x => x.type === 'text')) msgs.push({ role: m.role, content: textOf(p) });
    else msgs.push({ role: m.role, content: p.map(x => x.type === 'text' ? { type: 'text', text: x.text } : { type: 'image_url', image_url: { url: `data:${x.mime};base64,${x.data}` } }) });
  }
  const body = { model: cfg.model, messages: msgs };
  if (cfg.provider === 'openai') body.max_completion_tokens = cfg.maxTokens || 4000; else body.max_tokens = cfg.maxTokens || 4000;
  if (cfg.json && cfg.provider === 'openai') body.response_format = { type: 'json_object' };

function toAnthropic(cfg) {

    messages: cfg.messages.map(m => ({ role: m.role, content: parts(m.content).map(x => x.type === 'text' ? { type: 'text', text: x.text } : { type: 'image', source: { type: 'base64', media_type: x.mime, data: x.data } }) })),

    generationConfig: { maxOutputTokens: cfg.maxTokens || 4000 },
  };

}

async function call(cfg) {

    return { text: (j.content || []).filter(b => b.type === 'text').map(b => b.text).join(''), usage: j.usage };
  }
  if (cfg.provider === 'gemini') {
    const j = await post(`${base}/models/${encodeURIComponent(cfg.model)}:generateContent`, { 'x-goog-api-key': cfg.apiKey }, toGemini(cfg));

    return { text: (c.content?.parts || []).map(p => p.text || '').join(''), usage: j.usageMetadata };
  }

  }

}

async function listModels(cfg) {
  const base = baseOf(cfg);

  else if (cfg.provider === 'gemini') { url = `${base}/models?pageSize=200`; headers = { 'x-goog-api-key': cfg.apiKey }; }
  else { url = `${base}/models`; if (cfg.apiKey) headers = { authorization: `Bearer ${cfg.apiKey}` }; }
  const r = await fetch(url, { headers });
  if (!r.ok) throw new LLMError(`${r.status}: โหลดรายชื่อรุ่นไม่ได้`, r.status);
  const j = await r.json();
  if (cfg.provider === 'gemini') return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace(/^models\//, ''));
  return (j.data || []).map(m => m.id).sort();
}

// Pull the first JSON object out of a model reply (handles ```json fences and chatter around it).
function parseJSON(t) {
  const s = String(t || '').replace(/```(?:json)?/gi, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < a) throw new LLMError('AI ไม่ได้ตอบเป็น JSON', 0, s.slice(0, 400));
  return JSON.parse(s.slice(a, b + 1));
}

  wrap.innerHTML = `<div class="modal-box${wide ? ' wide' : ''}">${html}</div>`;
  const prev = document.activeElement;

const LEVELS = { Beginner: 10, Intermediate: 20, Advanced: 30 };
const PERSONAS = ['Cooperative', 'Anxious', 'Low Medical Literacy', 'Incomplete Recall'];

const unq = v => {
  v = v.trim();
  if (v.startsWith('"')) { try { return JSON.parse(v); } catch (_) { return v.slice(1, -1); } }
  if (/^-?\d+(\.\d+)?$/.test(v)) return Number(v);
  return v;
};
const q = v => typeof v === 'number' ? String(v) : /^[\w./-]+$/.test(String(v)) ? String(v) : JSON.stringify(String(v));

function parseCase(md, fileName = '') {
  const text = String(md).replace(/\r\n/g, '\n');
  const fm = text.match(/^---\n([\s\S]*?)\n---\n?/);
  const meta = {};
  if (fm) for (const line of fm[1].split('\n')) {
    const m = line.match(/^([A-Za-z_][\w]*)\s*:\s*(.*)$/);
    if (m) { let v = m[2]; if (!v.trim().startsWith('"')) v = v.replace(/\s+#.*$/, ''); meta[m[1]] = unq(v); }
  }
  const body = fm ? text.slice(fm[0].length) : text;
  const sections = {};
  const re = /^##\s*([A-H])\.[^\n]*$/gm;
  const marks = [...body.matchAll(re)];
  marks.forEach((m, i) => { sections[m[1]] = body.slice(m.index + m[0].length, i + 1 < marks.length ? marks[i + 1].index : body.length).trim(); });
  const c = { meta, sections, md: text, fileName };
  c.id = meta.id || fileName.replace(/\.md$/, '') || 'case';
  c.labs = tableRows(sections.D || '').map(r => ({ name: r[0], result: r[1] || '', ref: r[2] || '' })).filter(l => l.name);
  c.quota = Number(meta.quota) || LEVELS[meta.level] || 20;
  return c;
}

function tableRows(txt) {
  const rows = txt.split('\n').filter(l => /^\s*\|/.test(l));
  return rows.slice(2).map(r => r.trim().replace(/^\||\|$/g, '').split('|').map(s => s.trim()));
}

function checkCase(c) {
  const issues = [];
  for (const k of ['id', 'species', 'level', 'opening', 'patient']) if (!c.meta[k]) issues.push(`frontmatter ไม่มี ${k}`);
  if (c.meta.species && !['dog', 'cat'].includes(c.meta.species)) issues.push('species ต้องเป็น dog หรือ cat');
  if (c.meta.level && !LEVELS[c.meta.level]) issues.push('level ต้องเป็น Beginner, Intermediate หรือ Advanced');
  for (const k of Object.keys(SECTIONS)) if (!c.sections[k]) issues.push(`ไม่มีหัวข้อ ## ${k}.`);
  if (c.sections.B && !/\|\s*[VTSU]\s*\|/.test(c.sections.B)) issues.push('ตาราง B ไม่มีป้าย V/T/S/U');
  if (c.sections.D && !c.labs.length) issues.push('ตาราง D ไม่มีรายการตรวจ');
  if (c.sections.F && !/critical/i.test(c.sections.F)) issues.push('F ไม่มี Critical miss');
  return issues;
}

function setMeta(md, key, value) {
  const text = String(md);
  const fm = text.match(/^---\n([\s\S]*?)\n---/);
  if (!fm) return `---\n${key}: ${q(value)}\n---\n\n` + text;
  const lines = fm[1].split('\n');
  const i = lines.findIndex(l => l.startsWith(key + ':'));
  if (i >= 0) lines[i] = `${key}: ${q(value)}`; else lines.push(`${key}: ${q(value)}`);
  return `---\n${lines.join('\n')}\n---` + text.slice(fm[0].length);
}

Object.assign(__M, { SECTIONS, LEVELS, PERSONAS, parseCase, tableRows, checkCase, setMeta, cardOf });

    for (const x of dates.sort((a, b) => b.s.length - a.s.length)) {
      if (seen.has(x.s)) continue; seen.add(x.s);
      const n = Math.round((x.d - d0) / 864e5);

/* global JSZip */

const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };

const ITER = 200000;

async function keyFrom(code, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(String(code).trim()), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

async function seal(key, obj) {

  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));

}
async function open(key, box) {

async function packBundle(opts) {

  if (!opts.tasks.length) throw new Error('ยังไม่ได้เลือกเคส');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await keyFrom(opts.classCode, salt);
  const zip = new JSZip();
  const tasks = [];
  for (const [i, t] of opts.tasks.entries()) {
    const id = `t${i + 1}`;
    const card = { ...cardOf(t.case), quota: Number(t.quota) || t.case.quota, persona: t.persona || t.case.meta.persona || '' };
    zip.file(`cases/${id}.vilcase`, JSON.stringify(await seal(key, { md: t.case.md, quota: card.quota, persona: card.persona, brief: t.brief || '' })));

    format: 'vilpack/1', id: rid(), title: opts.title || 'ชุดฝึกซักประวัติ', instructions: opts.instructions || '', due: opts.due || '',
    order: opts.order || 'any', reveal: opts.reveal || 'after-each', created: new Date().toISOString(),

async function teacherZip(cases, title = 'cases') {

async function readBundle(file) {
  const zip = await JSZip.loadAsync(file);
  const mf = zip.file('manifest.json');
  if (!mf) throw new Error('ไม่ใช่ไฟล์ Bundle ของ Vet Interview Lab (ไม่มี manifest.json)');
  const manifest = JSON.parse(await mf.async('string'));
  if (manifest.format !== 'vilpack/1') throw new Error('รูปแบบ Bundle ไม่รองรับ: ' + manifest.format);
  const files = {};
  for (const t of manifest.tasks) files[t.id] = JSON.parse(await zip.file(t.file).async('string'));

}

async function unlockBundle({ manifest, files }, classCode) {
  const key = await keyFrom(classCode, unb64(manifest.kdf.salt));
  try { await open(key, manifest.check); } catch (_) { throw new Error('รหัสห้องไม่ถูกต้อง'); }

    c.quota = box.quota || c.quota; c.persona = box.persona; c.brief = box.brief;

}

async function saveRecord(rec, name) {
  const H = myHistory();

  rec.badges = badgesFor(rec, H);
